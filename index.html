<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CVM Product Demo</title>
<style>
:root{--navy:#102a43;--ink:#243b53;--muted:#6b7c8f;--line:#e3e9ef;--soft:#f7f9fb;--blue:#3157d5;--green:#148267;--amber:#b7791f;--red:#c34b4b;--dark:#0c1722;--dark2:#122331}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#fff}button,input,select,textarea{font:inherit}
.shell{display:grid;grid-template-columns:205px 1fr;min-height:100vh}.side{background:#10263d;color:#dce7f1;padding:22px 14px;position:sticky;top:0;height:100vh}.logo{font-size:21px;font-weight:850;margin:0 10px 24px}.logo small{display:block;font-size:9px;color:#8ea5b9;margin-top:2px}.nav{display:flex;flex-direction:column;gap:3px}.nav button{border:0;background:transparent;color:#aebdca;text-align:left;border-radius:8px;padding:10px 11px;font-size:11px;cursor:pointer}.nav button:hover{background:#183550;color:#fff}.nav button.on{background:#fff;color:#17324c;font-weight:800}.sep{height:1px;background:#29445c;margin:10px 8px}
.main{min-width:0}.top{height:66px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;background:#fffffff2;backdrop-filter:blur(12px);z-index:20}.top b{font-size:13px}.controls{display:flex;align-items:center;gap:8px}.control{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 9px;font-size:9px}.switch{display:flex;gap:6px;align-items:center}.switch input{accent-color:var(--red)}.btn{border:0;background:var(--blue);color:#fff;border-radius:8px;padding:9px 12px;font-size:10px;font-weight:800;cursor:pointer;transition:.18s}.btn:hover{transform:translateY(-1px);box-shadow:0 5px 14px #3157d522}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}.btn.danger{background:var(--red)}
.page{padding:28px;max-width:1400px;margin:auto;animation:fade .2s ease}@keyframes fade{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}.eyebrow{font-size:8px;letter-spacing:.12em;font-weight:900;color:var(--blue);text-transform:uppercase}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:18px}.hero h1,h1{font-size:27px;letter-spacing:-.035em;color:var(--navy);margin:5px 0}.sub{font-size:11px;color:var(--muted)}
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:19px 0}.metric{border:1px solid var(--line);border-radius:11px;padding:14px}.metric strong{display:block;font-size:21px;color:var(--navy)}.metric span{font-size:8px;color:var(--muted);font-weight:850}.card{border:1px solid var(--line);border-radius:11px;background:#fff;padding:15px}.card h3{margin:0 0 5px;font-size:12px;color:var(--navy)}
.table{border:1px solid var(--line);border-radius:11px;overflow:hidden}table{width:100%;border-collapse:collapse}th{background:#f8fafc;color:#718293;font-size:8px;text-transform:uppercase;letter-spacing:.04em;text-align:left}th,td{padding:10px 11px;border-bottom:1px solid #edf1f4}td{font-size:10px}.link{font-weight:850;color:var(--navy);cursor:pointer}.tiny{font-size:8px;color:var(--muted)}.badge{display:inline-block;border-radius:999px;padding:4px 7px;font-size:7px;font-weight:900;background:#edf1f5}.ok{color:var(--green);background:#edf8f4}.wait{color:var(--amber);background:#fff7e8}.err{color:var(--red);background:#fff0f0}.info{color:var(--blue);background:#eef2ff}
.progress{height:5px;background:#e7edf2;border-radius:99px;overflow:hidden;margin-top:4px}.progress i{display:block;height:100%;background:#657fd4;border-radius:99px;transition:width .6s}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.agenthead{display:flex;justify-content:space-between;gap:16px;align-items:flex-end}.learn{border:1px solid #dce5ed;background:linear-gradient(135deg,#fbfdff,#f4f8fc);border-radius:12px;padding:15px;margin:14px 0}.learnflow{display:flex;align-items:stretch;gap:6px;overflow:auto;margin:12px 0}.lnode{min-width:145px;border:1px solid #dfe7ee;background:#fff;border-radius:9px;padding:10px}.lnode b{font-size:9px;color:var(--navy)}.lnode span{display:block;font-size:7px;color:var(--muted);margin-top:3px}.arrow{align-self:center;color:#8294a5}.learnstats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.learnstats div{border:1px solid #e1e8ed;background:#fff;border-radius:8px;padding:9px}.learnstats b{display:block;font-size:12px}.learnstats span{font-size:7px;color:var(--muted)}
.run{border:1px solid var(--line);border-radius:12px;padding:15px;margin-top:12px}.pipeline{display:flex;align-items:flex-start;gap:6px;overflow:auto;margin:13px 0}.pnode{min-width:110px}.bubble{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:2px solid #dbe3e9;background:#fff;font-size:8px;font-weight:900}.pnode b{display:block;font-size:8px;margin-top:5px}.pnode span{font-size:7px;color:var(--muted)}.pnode.running .bubble{border-color:var(--blue);color:var(--blue);animation:pulse 1s infinite}.pnode.success .bubble{border-color:#55a58b;color:var(--green);background:#f1fbf7}.pnode.error .bubble{border-color:#d06b6b;color:var(--red);background:#fff5f5}.pnode.skipped .bubble{border-color:#a9b6c1;color:#788895}@keyframes pulse{50%{box-shadow:0 0 0 6px #3157d510}}
.steps{display:flex;gap:5px;margin:20px 0}.step{flex:1;border-top:3px solid #e3e9ee;padding-top:7px;font-size:8px;color:#8796a4}.step.on{border-color:var(--blue);color:var(--blue);font-weight:900}.step.done{border-color:#9eafbe}.choices{display:grid;grid-template-columns:1fr 1fr;gap:11px}.choice{border:1px solid var(--line);border-radius:11px;padding:18px;cursor:pointer}.choice.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}.choice b{font-size:13px}.choice p{font-size:9px;color:var(--muted)}textarea,.field{width:100%;border:1px solid #d8e0e7;border-radius:8px;padding:11px;outline:none}textarea{min-height:105px}.pickgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pick{border:1px solid var(--line);border-radius:9px;padding:10px;cursor:pointer}.pick.on{border-color:var(--blue);background:#fafbff}.pick b{font-size:9px}.pick p{font-size:7px;color:var(--muted)}
.drawerback{position:fixed;inset:0;background:#07142155;z-index:50;opacity:0;pointer-events:none;transition:.2s}.drawerback.show{opacity:1;pointer-events:auto}.drawer{position:fixed;right:0;top:0;width:min(720px,94vw);height:100vh;background:var(--dark);color:#e4edf4;z-index:51;transform:translateX(100%);transition:.28s cubic-bezier(.2,.8,.2,1);box-shadow:-20px 0 50px #0003}.drawer.show{transform:none}.dhead{min-height:64px;height:auto;border-bottom:1px solid #293b4b;display:flex;align-items:center;justify-content:space-between;padding:9px 17px;gap:10px}.dhead small{font:11px ui-monospace,monospace;color:#8fa4b6}.dclose{border:0;background:#1b2c3b;color:#dce6ee;border-radius:6px;padding:7px 9px;cursor:pointer}.dtabs{display:flex;gap:3px;padding:9px 14px;border-bottom:1px solid #293b4b}.dtabs button{border:0;background:transparent;color:#8ea2b4;padding:6px 8px;border-radius:6px;font-size:11px;cursor:pointer}.dtabs button.on{background:#1b2e40;color:#fff}.dbody{padding:15px;overflow:auto;height:calc(100vh - 108px)}.dc{border:1px solid #2b4052;border-radius:8px;background:#11202d;padding:11px;margin-bottom:9px}.dc h3{font-size:12px;margin:0 0 7px}.mono{font:11px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;color:#adbdca}.darkbtn{border:1px solid #385064;background:#162a3a;color:#e5edf4;border-radius:7px;padding:9px 11px;font-size:10px;cursor:pointer}.darkbtn.primary{background:#3157d5;border-color:#3157d5}.darkselect{background:#142635;color:#e5edf4;border:1px solid #385064;border-radius:7px;padding:9px;font-size:10px}.dactions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,10px);background:#142b40;color:#fff;padding:9px 13px;border-radius:8px;font-size:9px;opacity:0;transition:.2s;z-index:80;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1000px){.shell{grid-template-columns:170px 1fr}.metrics{grid-template-columns:repeat(2,1fr)}.grid2,.choices{grid-template-columns:1fr}.controls .control:nth-child(1){display:none}}

.buildgrid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,.75fr);gap:12px;align-items:start}
.flowedit{border:1px solid var(--line);border-radius:11px;background:#fbfcfd;padding:12px}
.flowrow{display:grid;grid-template-columns:28px 1fr auto;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid #e9eef2}
.flowrow:last-child{border-bottom:0}.flownum{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#edf2f7;font-size:8px;font-weight:900}
.flowrow input{border:0;background:transparent;width:100%;font-weight:750;color:var(--ink);outline:none}.flowrow button{border:0;background:transparent;color:var(--red);cursor:pointer}
.simresult{display:grid;grid-template-columns:1.1fr .9fr;gap:10px;margin-top:10px}.simhero{border:1px solid #dce5ed;border-radius:10px;padding:12px;background:#f8fafc}
.simhero strong{font-size:22px;color:var(--navy)}.uploadbox{border:1px dashed #aebbc6;border-radius:10px;padding:16px;text-align:center;background:#fbfcfd;cursor:pointer}
.uploadbox b{display:block;font-size:10px;color:var(--navy)}.uploadbox span{font-size:8px;color:var(--muted)}
.rulegrid{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}.compactrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #edf1f4}
@media(max-width:900px){.buildgrid,.simresult,.rulegrid{grid-template-columns:1fr}}
</style></head>
<body><div class="shell">
<aside class="side"><div class="logo">CVM<small>Enterprise Agent Platform</small></div><div class="nav">
<button data-v="home" class="on">Home</button><button data-v="agents">Agents</button><button data-v="build">Build</button><button data-v="debug">Debug</button><button data-v="insights">Insights</button><div class="sep"></div><button data-v="policies">Policies</button><button data-v="security">Security</button><button data-v="dev">Developer Tools</button></div></aside>
<section class="main"><header class="top"><b id="title">Enterprise Agent Fleet</b><div class="controls">
<label class="control switch"><input id="fault" type="checkbox"> HTTP 503</label><label class="control switch"><input id="worker" type="checkbox"> Worker failure</label>
<select id="runtime" class="control"><option value="aws">AWS Bedrock · Claude Sonnet</option><option value="azure">Azure AI · GPT-5</option><option value="gcp">Vertex AI · Gemini 2.5 Pro</option></select>
<button class="btn secondary" onclick="openConsole()">CVM Console</button></div></header><div id="page"></div></section></div>
<div id="back" class="drawerback" onclick="closeConsole()"></div><aside id="drawer" class="drawer"><div class="dhead"><div><b>CVM Console</b><small id="did"> · cvm-41564d</small></div><div style="display:flex;align-items:center;gap:7px">
<label class="darkbtn" style="display:flex;align-items:center;gap:6px"><input id="dfault" type="checkbox" onchange="syncFault(this)"> HTTP 503</label>
<label class="darkbtn" style="display:flex;align-items:center;gap:6px"><input id="dworker" type="checkbox" onchange="syncWorker(this)"> Worker failure</label>
<select id="druntime" class="darkselect" onchange="syncRuntime(this)">
<option value="aws">AWS · Claude</option><option value="azure">Azure · GPT-5</option><option value="gcp">GCP · Gemini</option>
</select>
<button class="dclose" onclick="closeConsole()">Close</button></div></div><div class="dtabs"><button data-t="trace" class="on">Trace</button><button data-t="state">Raw State</button><button data-t="logs">Logs</button><button data-t="runtime">Runtime</button></div><div id="dbody" class="dbody"></div></aside><div id="toast" class="toast"></div>
<script>
const $=x=>document.getElementById(x), sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ROOT="cvm-41564d", RUNTIMES={aws:{cloud:"AWS Bedrock",model:"Claude Sonnet",region:"us-west-2"},azure:{cloud:"Azure AI",model:"GPT-5",region:"westus2"},gcp:{cloud:"Vertex AI",model:"Gemini 2.5 Pro",region:"us-west1"}};
const agents=[
{id:ROOT+"/01",app:"claims.app.cvm",name:"Northstar Claims",domain:"Insurance",status:"Healthy",runs:1284,retries:7,ports:2,learn:86,outcomes:937,patterns:21},
{id:ROOT+"/02",app:"vendor.app.cvm",name:"Vendor Onboarding",domain:"Procurement",status:"Waiting",runs:416,retries:4,ports:0,learn:71,outcomes:302,patterns:14},
{id:ROOT+"/03",app:"invoice.app.cvm",name:"Invoice Reconciliation",domain:"Finance",status:"Healthy",runs:3821,retries:19,ports:1,learn:91,outcomes:2789,patterns:57},
{id:ROOT+"/04",app:"access.app.cvm",name:"Access Provisioning",domain:"IT",status:"Policy hold",runs:906,retries:8,ports:0,learn:78,outcomes:661,patterns:24},
{id:ROOT+"/05",app:"refunds.app.cvm",name:"Customer Refunds",domain:"Commerce",status:"Healthy",runs:2138,retries:13,ports:3,learn:88,outcomes:1561,patterns:39},
{id:ROOT+"/06",app:"contracts.app.cvm",name:"Contract Review",domain:"Legal",status:"Healthy",runs:632,retries:3,ports:0,learn:69,outcomes:461,patterns:12},
{id:ROOT+"/07",app:"incident.app.cvm",name:"Incident Response",domain:"Engineering",status:"Recovering",runs:1547,retries:26,ports:4,learn:94,outcomes:1129,patterns:68},
{id:ROOT+"/08",app:"employee.app.cvm",name:"Employee Onboarding",domain:"HR / IT",status:"Waiting",runs:711,retries:5,ports:0,learn:74,outcomes:519,patterns:17},
{id:ROOT+"/09",app:"fraud.app.cvm",name:"Fraud Investigation",domain:"Financial Services",status:"Healthy",runs:1892,retries:17,ports:2,learn:89,outcomes:1381,patterns:44},
{id:ROOT+"/10",app:"supply.app.cvm",name:"Supply Chain Exception",domain:"Operations",status:"Healthy",runs:1106,retries:11,ports:5,learn:82,outcomes:807,patterns:31}
];
const policies=[["POL-001","Human approval above $10K","Financial actions"],["POL-014","No duplicate external effects","Transactional agents"],["POL-021","PII stays in approved region","Sensitive data"],["POL-033","High-risk action audit trail","Regulated actions"]];
const security=[["SEC-004","Approved model providers only"],["SEC-011","Secrets via managed identity"],["SEC-018","Tool egress allowlist"],["SEC-024","Signed runtime artifacts"]];
let view="home",active=agents[0],run=null,tab="trace",build={stage:0,mode:null,intent:"",sources:[],policies:["POL-014","POL-033"],local:[],sim:false,model:null,flow:["Observe input","Retrieve enterprise context","Reason over task","Evaluate policies","Invoke approved tools","Checkpoint durable state"],simRunning:false};
function toast(x){$("toast").textContent=x;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1600)}
function badge(s){let c=s==="Healthy"||s==="COMPLETED"?"ok":s==="Waiting"||s==="Policy hold"||s==="POLICY_HOLD"?"wait":s==="Recovering"||s==="SUSPENDED_ERROR"?"err":"info";return `<span class="badge ${c}">${s}</span>`}
function setView(v){view=v;document.querySelectorAll(".nav button[data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v===v));render()}
document.querySelectorAll(".nav button[data-v]").forEach(b=>b.onclick=()=>setView(b.dataset.v));
function render(){({home:home,agents:agentsView,build:buildView,debug:debugView,insights:insightsView,policies:policiesView,security:securityView,dev:devView,agent:agentView}[view]||home)()}
function title(x){$("title").textContent=x}
function table(){return `<div class=table><table><thead><tr><th>Agent</th><th>Domain</th><th>Status</th><th>Runs</th><th>Recoveries</th><th>Portable</th><th>Learning</th><th></th></tr></thead><tbody>${agents.map(a=>`<tr><td><span class=link onclick="openAgent('${a.id}')">${a.name}</span><div class=tiny>${a.id} · ${a.app}</div></td><td>${a.domain}</td><td>${badge(a.status)}</td><td>${a.runs.toLocaleString()}</td><td>${a.retries}</td><td>${a.ports}</td><td>${a.learn}%<div class=progress><i style="width:${a.learn}%"></i></div></td><td><button class="btn secondary" onclick="${a.status==="Waiting"||a.status==="Policy hold"?`openHeldFromFleet('${a.id}')`:`runAgent('${a.id}')`}">${a.status==="Waiting"?"Open wait":a.status==="Policy hold"?"Review":"Run"}</button></td></tr>`).join("")}</tbody></table></div>`}
function home(){title("Enterprise Agent Fleet");let runs=agents.reduce((x,a)=>x+a.runs,0),rec=agents.reduce((x,a)=>x+a.retries,0),ports=agents.reduce((x,a)=>x+a.ports,0);$("page").innerHTML=`<div class=page><div class=hero><div><div class=eyebrow>Production</div><h1>Your agent fleet</h1><div class=sub>Build, operate and improve enterprise agents inside durable CVM boundaries.</div></div><button class=btn onclick="setView('build')">Build agent</button></div><div class=metrics><div class=metric><strong>${agents.length}</strong><span>ACTIVE AGENTS</span></div><div class=metric><strong>${runs.toLocaleString()}</strong><span>EXECUTIONS TODAY</span></div><div class=metric><strong>99.4%</strong><span>SUCCESS RATE</span></div><div class=metric><strong>${rec}</strong><span>RECOVERED EXECUTIONS</span></div><div class=metric><strong>${ports}</strong><span>PORTABILITY EVENTS</span></div></div>${table()}</div>`}
function agentsView(){title("Agents");$("page").innerHTML=`<div class=page><div class=eyebrow>Fleet</div><h1>Agents</h1><div class=sub>Each agent runs inside its own app.cvm boundary with durable state and learning lineage.</div><div style="margin-top:17px">${table()}</div></div>`}
function openAgent(id){active=agents.find(a=>a.id===id)||active;view="agent";document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("on"));if((active.status==="Waiting"||active.status==="Policy hold")&&(!run||run.agent!==active.id))seedHeldRun(active);agentView()}
function seedHeldRun(a){let rt={...RUNTIMES[$("runtime").value]};if(a.status==="Policy hold"){run={id:"tx_hold_"+a.id.split("/")[1],agent:a.id,label:a.name,state:"POLICY_HOLD",runtime:rt,steps:["success","success","success","success","idle"],note:heldScenario(a).note,checkpoint:"cp_policy_"+a.id.split("/")[1],effect:null,logs:["restore() · durable policy checkpoint",heldScenario(a).log],ports:0,holdType:"policy"}}else{run={id:"tx_wait_"+a.id.split("/")[1],agent:a.id,label:a.name,state:"WAITING_EXTERNAL",runtime:rt,steps:["success","success","success","success","idle"],note:heldScenario(a).note,checkpoint:"cp_wait_"+a.id.split("/")[1],effect:null,logs:["restore() · durable wait checkpoint",heldScenario(a).log],ports:0,holdType:"wait"}}}
function heldScenario(a){if(a.app==="access.app.cvm")return {note:"Privileged production access requires Security approval before provisioning.",log:"policy.evaluate · privileged_access → HOLD",primary:"Approve access",adjust:"Restrict to read-only"};if(a.app==="vendor.app.cvm")return {note:"Waiting for vendor W-9 and bank verification event. Execution has been durable for 3 days.",log:"event.wait · vendor_verification",primary:"Simulate verification received",adjust:"Request documents"};if(a.app==="employee.app.cvm")return {note:"Waiting for manager equipment selection before provisioning can continue.",log:"event.wait · manager_equipment_choice",primary:"Simulate manager response",adjust:"Send reminder"};return {note:"Execution is waiting for an external event.",log:"event.wait",primary:"Resume",adjust:"Keep waiting"}}
function openHeldFromFleet(id){active=agents.find(a=>a.id===id)||active;seedHeldRun(active);view="agent";document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("on"));agentView();openConsole()}
function learning(a){return `<div class=learn><div class=eyebrow>Self-learning model · enterprise owned</div><h3 style="margin:4px 0;color:var(--navy)">Learning lineage · ${a.app}</h3><div class=sub>Successful workflow outcomes are retained per app.cvm and compound over time. This is the product view of that lineage, not a vendor model fine-tune.</div><div class=learnflow><div class=lnode><b>Successful outcomes</b><span>Completed workflow state + decisions</span></div><span class=arrow>→</span><div class=lnode><b>Pattern memory</b><span>Reusable execution and recovery patterns</span></div><span class=arrow>→</span><div class=lnode><b>Candidate improvement</b><span>Routing / recovery / workflow suggestion</span></div><span class=arrow>→</span><div class=lnode><b>Eval gate</b><span>Quality and policy checks</span></div><span class=arrow>→</span><div class=lnode><b>Promoted lineage</b><span>Available to future executions</span></div></div><div class=learnstats><div><b>${a.outcomes.toLocaleString()}</b><span>SUCCESSFUL OUTCOMES</span></div><div><b>${a.patterns}</b><span>REUSABLE PATTERNS</span></div><div><b>${a.learn}%</b><span>LINEAGE MATURITY · DEMO</span></div><div><b>Enterprise</b><span>OWNERSHIP BOUNDARY</span></div></div></div>`}
function agentView(){title(active.name);$("page").innerHTML=`<div class=page><div class=agenthead><div><div class=eyebrow>${active.domain} · ${active.id}</div><h1>${active.name}</h1><div class=sub>${active.app}</div></div><div><button class="btn secondary" onclick=openConsole()>Inspect runtime</button> ${active.status==="Waiting"||active.status==="Policy hold"?`<button class=btn onclick="openConsole()">Open held execution</button>`:`<button class=btn onclick="runAgent('${active.id}')">Run agent</button>`}</div></div>${learning(active)}<div id=runarea>${run&&run.agent===active.id?runPanel():'<div class=run><h3>Ready to run</h3><div class=sub>Click Run agent. Use the top bar only when you want to inject a failure or change the target runtime.</div></div>'}</div></div>`}
function runPanel(){let names=["Policy","Model","Effect","Checkpoint","Sync"];return `<div class=run><div style="display:flex;justify-content:space-between"><div><h3 style="margin:0">${run.label} · ${run.id}</h3><div class=sub>${run.runtime.cloud} · ${run.runtime.model}</div></div>${badge(run.state)}</div><div class=pipeline>${run.steps.map((s,i)=>`<div class="pnode ${s}"><div class=bubble>${s==="success"?"✓":s==="error"?"!":s==="skipped"?"↷":i+1}</div><b>${names[i]}</b><span>${s}</span></div>${i<4?'<span class=arrow>→</span>':''}`).join("")}</div><div class=sub>${run.note}</div>${["SUSPENDED_ERROR","WORKER_FAILED","POLICY_HOLD","WAITING_EXTERNAL"].includes(run.state)?`<div style="margin-top:10px"><button class=btn onclick=openConsole()>${run.state==="POLICY_HOLD"?"Review decision":run.state==="WAITING_EXTERNAL"?"Open wait":"Inspect & recover"}</button></div>`:""}</div>`}
async function runAgent(id){active=agents.find(a=>a.id===id)||active;view="agent";document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("on"));let rt={...RUNTIMES[$("runtime").value]};run={id:"tx_"+Math.random().toString(36).slice(2,9),agent:id,label:active.name,state:"RUNNING",runtime:rt,steps:["running","idle","idle","idle","idle"],note:"Policy evaluation started",checkpoint:null,effect:null,logs:[`execute() · ${active.app}`],ports:0};agentView();await phase(0,"Policy evaluated");await phase(1,`Model invoked · ${run.runtime.model}`);await phase(2,"External effect committed");run.effect="effect_"+Math.random().toString(36).slice(2,9);await phase(3,"Durable checkpoint written");run.checkpoint="cp_"+Math.random().toString(36).slice(2,7);
if($("worker").checked){$("worker").checked=false;syncDrawerControls();run.state="WORKER_FAILED";run.note="Worker terminated after checkpoint. Durable state is intact and ready on another worker.";run.logs.push("worker.heartbeat · lost","worker.exit · simulated failure","checkpoint · durable state preserved");refreshRun();openConsole();return}
run.steps[4]="running";run.note="Synchronizing upstream system";refreshRun();await sleep(650);if($("fault").checked){$("fault").checked=false;run.steps[4]="error";run.state="SUSPENDED_ERROR";run.note="HTTP 503 after external effect. CVM preserved the checkpoint and committed effect.";run.logs.push("sync · HTTP 503","suspend() · after_effect");refreshRun();openConsole();return}run.steps[4]="success";completeRun("Execution completed")}
async function phase(i,note){run.steps[i]="running";run.note=note+"…";refreshRun();await sleep(520);run.steps[i]="success";run.logs.push(note);refreshRun()}
function refreshRun(){if(view==="agent"){let x=$("runarea");if(x)x.innerHTML=runPanel()}if($("drawer").classList.contains("show"))renderConsole()}
function completeRun(note){run.state="COMPLETED";run.note=note+" · successful outcome added to learning lineage";run.logs.push("transaction.complete","learning.commit · successful outcome");active.runs++;active.outcomes++;active.learn=Math.min(99,active.learn+1);refreshRun();toast("Completed · learning lineage updated")}
function debugView(){title("Debug");$("page").innerHTML=`<div class=page><div class=hero><div><div class=eyebrow>Executions</div><h1>Debug</h1><div class=sub>Debug is intentionally simple: run an agent, then inspect only executions that need attention.</div></div></div><div class=grid2 style="margin-top:16px"><div class=card><h3>Current execution</h3>${run?`<div style="margin-top:10px"><b>${run.label}</b><div class=tiny>${run.id} · ${run.state}</div><div class=pipeline>${run.steps.map((s,i)=>`<div class="pnode ${s}"><div class=bubble>${i+1}</div></div>`).join("")}</div><button class=btn onclick=openConsole()>Open runtime inspector</button></div>`:'<div class=sub style="margin-top:8px">No active execution. Run an agent from Home or Agents.</div>'}</div><div class=card><h3>Needs attention</h3><div class=sub style="margin-top:8px">${run&&["SUSPENDED_ERROR","WORKER_FAILED","POLICY_HOLD","WAITING_EXTERNAL"].includes(run.state)?`1 execution requires attention · ${run.state}`:"No executions require attention."}</div>${run&&["SUSPENDED_ERROR","WORKER_FAILED","POLICY_HOLD","WAITING_EXTERNAL"].includes(run.state)?'<button class="btn secondary" style="margin-top:10px" onclick=openConsole()>Open execution</button>':""}</div></div></div>`}
function insightsView(){title("Insights");$("page").innerHTML=`<div class=page><div class=eyebrow>Learning lineage</div><h1>Self-learning model</h1><div class=sub>Fleet view of the learning layer described in the CVM architecture: successful outcomes compound while lineage remains attached to each app.cvm.</div><div class=grid3 style="margin-top:16px"><div class=metric><strong>${agents.reduce((x,a)=>x+a.outcomes,0).toLocaleString()}</strong><span>SUCCESSFUL OUTCOMES RETAINED</span></div><div class=metric><strong>${agents.reduce((x,a)=>x+a.patterns,0)}</strong><span>REUSABLE PATTERNS</span></div><div class=metric><strong>${Math.round(agents.reduce((x,a)=>x+a.learn,0)/agents.length)}%</strong><span>AVG LINEAGE MATURITY · DEMO</span></div></div>${learning(active)}<div class=table style="margin-top:12px"><table><thead><tr><th>app.cvm</th><th>Outcomes</th><th>Patterns</th><th>Lineage</th></tr></thead><tbody>${agents.map(a=>`<tr><td><span class=link onclick="openAgent('${a.id}')">${a.app}</span></td><td>${a.outcomes.toLocaleString()}</td><td>${a.patterns}</td><td>${a.learn}%<div class=progress><i style="width:${a.learn}%"></i></div></td></tr>`).join("")}</tbody></table></div></div>`}
function policiesView(){title("Policies");$("page").innerHTML=`<div class=page><div class=hero><div><div class=eyebrow>Company governance</div><h1>Policies</h1><div class=sub>Central rules inherited by agents. Add manually or import a policy file.</div></div><button class=btn onclick=addPolicy()>＋ New policy</button></div><div class=rulegrid style="margin-top:16px"><div class=table><table>${policies.map(p=>`<tr><td><b>${p[1]}</b><div class=tiny>${p[0]}</div></td><td>${p[2]}</td><td>${badge("Healthy")}</td></tr>`).join("")}</table></div><div><div class=uploadbox onclick="$('policyFile').click()"><b>Import policies</b><span>JSON, YAML, CSV or text · demo import</span><input id=policyFile type=file hidden onchange="importRuleFile('policy',this)"></div><div class=card style="margin-top:10px"><h3>Scope</h3><div class=sub>Company policies appear automatically in the Build policy picker. Local policies remain attached only to their app.cvm.</div></div></div></div></div>`}
function addPolicy(){let x=prompt("Policy name:");if(!x||!x.trim())return;policies.push(["POL-"+String(policies.length+40).padStart(3,"0"),x.trim(),"Company"]);policiesView();toast("Policy added")}
function importRuleFile(kind,input){let f=input.files&&input.files[0];if(!f)return;let name=f.name.replace(/\.[^.]+$/,"");if(kind==="policy"){policies.push(["POL-"+String(policies.length+40).padStart(3,"0"),name,"Imported"]);policiesView()}else{security.push(["SEC-"+String(security.length+40).padStart(3,"0"),name]);securityView()}toast(f.name+" imported")}

function securityView(){title("Security");$("page").innerHTML=`<div class=page><div class=hero><div><div class=eyebrow>Company control plane</div><h1>Security</h1><div class=sub>Security controls inherited by production CVM applications.</div></div><button class=btn onclick=addSecurity()>＋ New control</button></div><div class=rulegrid style="margin-top:16px"><div class=table><table>${security.map(p=>`<tr><td><b>${p[1]}</b><div class=tiny>${p[0]}</div></td><td>Company / production</td><td>${badge("Healthy")}</td></tr>`).join("")}</table></div><div><div class=uploadbox onclick="$('securityFile').click()"><b>Import security controls</b><span>JSON, YAML, CSV or text · demo import</span><input id=securityFile type=file hidden onchange="importRuleFile('security',this)"></div><div class=card style="margin-top:10px"><h3>Inherited enforcement</h3><div class=sub>Provider allowlists, identity, egress and artifact controls apply across the fleet.</div></div></div></div></div>`}
function addSecurity(){let x=prompt("Security control:");if(!x||!x.trim())return;security.push(["SEC-"+String(security.length+40).padStart(3,"0"),x.trim()]);securityView();toast("Security control added")}

function devView(){title("Developer Tools");$("page").innerHTML=`<div class=page><div class=eyebrow>Runtime</div><h1>Developer Tools</h1><div class=sub>Inspect the portable interface beneath app.cvm.</div><div class=grid2 style="margin-top:16px"><div class=card><h3>CVM Runtime Interface</h3><div class=tiny style="line-height:2">execute() · checkpoint() · suspend() · resume()<br>reconcileEffects() · rebindRuntime() · restore()</div><button class=btn style="margin-top:10px" onclick=openConsole()>Open CVM Console</button></div><div class=card><h3>Portable bindings</h3><div class=sub>Model · hardware · data · location are runtime bindings rather than application identity.</div></div></div></div>`}
function buildView(){title("Build agent");let names=["Start","Data","Policies","Review","Simulate"];$("page").innerHTML=`<div class="page" style="max-width:980px"><div class=eyebrow>Build</div><h1>New agent</h1><div class=sub>Progressive setup. Model selection happens only after simulation.</div><div class=steps>${names.map((x,i)=>`<div class="step ${i===build.stage?"on":i<build.stage?"done":""}">${i+1} · ${x}</div>`).join("")}</div>${buildStage()}</div>`}
function buildStage(){if(build.stage===0)return `<div class=choices><div class="choice ${build.mode==="intent"?"on":""}" onclick="build.mode='intent';buildView()"><b>Describe the intent</b><p>Start from the business outcome.</p></div><div class="choice ${build.mode==="existing"?"on":""}" onclick="build.mode='existing';buildView()"><b>Bring an existing agent</b><p>Wrap existing code in a CVM boundary.</p></div></div>${build.mode?`<div class=card style="margin-top:11px">${build.mode==="intent"?`<textarea id=intent placeholder="Reconcile vendor invoices, route exceptions above $25K for approval, then post approved payments.">${build.intent}</textarea>`:`<input class=field placeholder="Repository / package / endpoint">`}<div style="text-align:right;margin-top:10px"><button class=btn onclick=nextBuild()>Continue</button></div></div>`:""}`;
if(build.stage===1){let x=["Snowflake","SAP S/4HANA","Salesforce","Microsoft 365","PostgreSQL","Object store"];return `<div class=card><h3>Connect data</h3><div class=pickgrid>${x.map(v=>`<div class="pick ${build.sources.includes(v)?"on":""}" onclick="toggleSource('${v}')"><b>${build.sources.includes(v)?"✓ ":""}${v}</b><p>Managed connector</p></div>`).join("")}</div>${buildButtons()}</div>`}
if(build.stage===2)return `<div class=card><h3>Apply policies</h3><div class=sub>Choose company policy or add one local to this agent.</div><div class=pickgrid style="margin-top:10px">${policies.map(p=>`<div class="pick ${build.policies.includes(p[0])?"on":""}" onclick="togglePolicy('${p[0]}')"><b>${build.policies.includes(p[0])?"✓ ":""}${p[1]}</b><p>${p[0]} · ${p[2]}</p></div>`).join("")}<div class=pick onclick=localPolicy()><b>＋ Add local policy</b><p>Agent only</p></div></div>${buildButtons()}</div>`;
if(build.stage===3)return `<div class=buildgrid><div class=card><div class=hero><div><h3>Agent flow</h3><div class=sub>Edit the proposed flow before simulation.</div></div><button class="btn secondary" onclick=addFlowStep()>＋ Step</button></div><div class=flowedit style="margin-top:10px">${build.flow.map((x,i)=>`<div class=flowrow><div class=flownum>${i+1}</div><input value="${escape(x)}" onchange="editFlow(${i},this.value)"><button onclick="removeFlow(${i})">Remove</button></div>`).join("")}</div><div style="display:flex;justify-content:space-between;margin-top:12px"><button class="btn secondary" onclick="build.stage=2;buildView()">Back</button><button class=btn onclick="build.stage=4;build.sim=false;buildView()">Run simulation</button></div></div><div class=card><h3>Build summary</h3><div class=tiny style="line-height:2.2">${ROOT}/11<br>agent-11.app.cvm<br>${build.sources.length} data sources<br>${build.policies.length+build.local.length} policies<br>Model: unbound</div><div class=learn style="margin:12px 0 0"><div class=eyebrow>Runtime boundary</div><div class=sub style="margin-top:5px">State, policy, effects and learning lineage move with the app.cvm.</div></div></div></div>`;
return simulation()}
function buildButtons(){return `<div style="display:flex;justify-content:space-between;margin-top:12px"><button class="btn secondary" onclick="build.stage--;buildView()">Back</button><button class=btn onclick=nextBuild()>Continue</button></div>`}
function nextBuild(){if(build.stage===0){if(!build.mode)return toast("Choose a starting point");if(build.mode==="intent"){build.intent=$("intent").value.trim();if(build.intent.length<10)return toast("Add a little more detail")}}build.stage=Math.min(4,build.stage+1);buildView()}
function toggleSource(x){build.sources.includes(x)?build.sources=build.sources.filter(y=>y!==x):build.sources.push(x);buildView()}function togglePolicy(x){build.policies.includes(x)?build.policies=build.policies.filter(y=>y!==x):build.policies.push(x);buildView()}function localPolicy(){let x=prompt("Local policy:");if(x&&x.trim()){build.local.push(x.trim());buildView()}}
function simulation(){let m=[["Claude Sonnet","AWS Bedrock","$2.10","94%","620 ms","99.95%"],["Gemini 2.5 Pro","Vertex AI","$1.80","92%","510 ms","99.90%"],["GPT-5","Azure AI","$2.40","96%","690 ms","99.97%"]];return `<div class=buildgrid><div class=card><div class=hero><div><h3>Simulation</h3><div class=sub>Run the exact flow you just edited against representative transactions.</div></div><button class=btn onclick=runBuildSimulation()>${build.simRunning?"Running…":"Run simulation"}</button></div>${build.simRunning?`<div class=simhero style="margin-top:11px"><b>Evaluating 1,000 transactions…</b><div class=progress style="margin-top:10px"><i style="width:72%"></i></div><div class=tiny style="margin-top:8px">Policy gates · tool failures · replay safety · model quality</div></div>`:""}${build.sim?`<div class=simresult><div class=simhero><div class=eyebrow>Simulation passed</div><strong>99.6%</strong><div class=sub>successful completion</div><div class=tiny style="line-height:2;margin-top:8px">✓ policy applied before external effects<br>✓ 37 injected failures recovered<br>✓ 0 duplicate external effects<br>✓ 11 human approvals resumed correctly</div></div><div class=simhero><div class=eyebrow>Flow observations</div><div class=tiny style="line-height:2">6 execution steps<br>2 durable checkpoints recommended<br>1 policy boundary before payment<br>Model remains unbound</div></div></div><h3 style="margin-top:14px">Choose a runtime model</h3><div class=table style="margin-top:8px"><table><thead><tr><th></th><th>Model</th><th>Cost</th><th>Accuracy</th><th>Latency</th><th>Availability</th></tr></thead><tbody>${m.map(x=>`<tr><td><input type=radio name=m ${build.model===x[0]?"checked":""} onchange="build.model='${x[0]}';buildView()"></td><td><b>${x[0]}</b><div class=tiny>${x[1]}</div></td><td>${x[2]}</td><td>${x[3]}</td><td>${x[4]}</td><td>${x[5]}</td></tr>`).join("")}</tbody></table></div>`:`<div class=simhero style="margin-top:11px"><div class=sub>No result yet. Click <b>Run simulation</b> to execute the flow and compare model choices.</div></div>`}</div><div class=card><h3>Flow being tested</h3>${build.flow.map((x,i)=>`<div class=compactrow><span><b>${i+1}. ${escape(x)}</b></span>${i===3?'<span class="badge wait">policy gate</span>':i===5?'<span class="badge info">checkpoint</span>':""}</div>`).join("")}<div style="display:flex;gap:7px;margin-top:12px"><button class="btn secondary" onclick="build.stage=3;buildView()">Edit flow</button>${build.sim?'<button class=btn onclick=deploy()>Deploy</button>':""}</div></div></div>`}
async function runBuildSimulation(){if(build.simRunning)return;build.simRunning=true;build.sim=false;buildView();await sleep(1100);build.simRunning=false;build.sim=true;buildView();toast("Simulation complete")}
function editFlow(i,v){build.flow[i]=v}
function removeFlow(i){if(build.flow.length<=2)return toast("Keep at least two steps");build.flow.splice(i,1);buildView()}
function addFlowStep(){build.flow.push("New execution step");buildView()}

function deploy(){if(!build.model)return toast("Select a model");if(!agents.some(a=>a.id===ROOT+"/11"))agents.push({id:ROOT+"/11",app:"agent-11.app.cvm",name:"Intent-built Agent",domain:"Finance",status:"Healthy",runs:0,retries:0,ports:0,learn:12,outcomes:0,patterns:0});toast("Agent deployed");setTimeout(()=>setView("agents"),400)}
function openConsole(){syncDrawerControls();tab="trace";$("back").classList.add("show");$("drawer").classList.add("show");document.querySelectorAll(".dtabs button").forEach(b=>b.classList.toggle("on",b.dataset.t==="trace"));renderConsole()}
function closeConsole(){$("back").classList.remove("show");$("drawer").classList.remove("show")}
document.querySelectorAll(".dtabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll(".dtabs button").forEach(x=>x.classList.toggle("on",x===b));renderConsole()});
function renderConsole(){syncDrawerControls();let r=run;if(tab==="trace")$("dbody").innerHTML=`<div class=dc><h3>${active.id} · ${active.app}</h3><div class=mono>state        ${r?r.state:"READY"}<br>transaction  ${r?r.id:"—"}<br>checkpoint   ${r&&r.checkpoint?r.checkpoint:"—"}<br>effect       ${r&&r.effect?r.effect:"—"}<br>learning     lineage_${active.id.split("/")[1]}</div></div><div class=dc><h3>Runtime interface</h3><div class=mono>execute() → checkpoint() → suspend()/resume()<br>reconcileEffects() → rebindRuntime() → restore()</div></div>${r&&r.state==="POLICY_HOLD"?`<div class=dc><h3>Policy decision required</h3><div class=mono>${heldScenario(active).note}<br><br>checkpoint · ${r.checkpoint}<br>external effect · not committed</div><div class=dactions><button class="darkbtn primary" onclick=resolveHeld("approve")>${heldScenario(active).primary}</button><button class=darkbtn onclick=resolveHeld("adjust")>${heldScenario(active).adjust}</button></div></div>`:""}${r&&r.state==="WAITING_EXTERNAL"?`<div class=dc><h3>Durable wait</h3><div class=mono>${heldScenario(active).note}<br><br>checkpoint · ${r.checkpoint}<br>worker · released while waiting</div><div class=dactions><button class="darkbtn primary" onclick=resolveHeld("event")>${heldScenario(active).primary}</button><button class=darkbtn onclick=resolveHeld("adjust")>${heldScenario(active).adjust}</button></div></div>`:""}${r&&(r.state==="SUSPENDED_ERROR"||r.state==="WORKER_FAILED")?`<div class=dc><h3>${r.state==="WORKER_FAILED"?"Worker lost":"Suspended execution"}</h3><div class=mono>${r.state==="WORKER_FAILED"?"The worker disappeared after a durable checkpoint. CVM can restore the transaction on a new worker without restarting the application.":"External effect is committed. Resume will reconcile it before retrying upstream sync."}</div><div class=dactions><button class="darkbtn primary" onclick=resumeRun()>${r.state==="WORKER_FAILED"?"Restore on new worker":"Resume / Replay"}</button></div></div>`:""}`;
if(tab==="state")$("dbody").innerHTML=`<div class=dc><h3>Raw state</h3><pre class=mono>${escape(JSON.stringify(r||{cvmId:active.id,app:active.app,status:"READY",learningLineage:"lineage_"+active.id.split("/")[1]},null,2))}</pre></div>`;
if(tab==="logs")$("dbody").innerHTML=`<div class=dc><h3>Logs</h3><div class=mono>${(r?r.logs:["runtime ready","learning lineage attached"]).join("<br>")}</div></div>`;
if(tab==="runtime")$("dbody").innerHTML=`<div class=dc><h3>Runtime binding</h3><div class=mono>Current: ${r?r.runtime.cloud+" / "+r.runtime.model:RUNTIMES[$("runtime").value].cloud+" / "+RUNTIMES[$("runtime").value].model}</div>${r&&(r.state==="SUSPENDED_ERROR"||r.state==="WORKER_FAILED")?`<div style="margin-top:9px"><select id=move class=darkselect><option value=aws>AWS Bedrock · Claude Sonnet</option><option value=azure>Azure AI · GPT-5</option><option value=gcp>Vertex AI · Gemini 2.5 Pro</option></select><div class=dactions><button class=darkbtn onclick=moveRuntime()>Move execution</button><button class="darkbtn primary" onclick=resumeRun()>Resume / Replay</button></div></div>`:""}</div>`}
function moveRuntime(){if(!run)return;let old=run.runtime,rt={...RUNTIMES[$("move").value]};run.runtime=rt;run.ports++;active.ports++;run.logs.push(`rebindRuntime() · ${old.cloud}/${old.model} → ${rt.cloud}/${rt.model}`,"restore() · durable checkpoint");$("runtime").value=$("move").value;renderConsole();refreshRun();toast("Execution moved to "+rt.model)}
async function resumeRun(){if(!run||!["SUSPENDED_ERROR","WORKER_FAILED"].includes(run.state))return;let workerRecovery=run.state==="WORKER_FAILED";let selected={...RUNTIMES[$("runtime").value]};if(selected.model!==run.runtime.model){let old=run.runtime;run.runtime=selected;run.ports++;active.ports++;run.logs.push(`rebindRuntime() · ${old.model} → ${selected.model}`)}run.state="RUNNING";run.steps[2]="skipped";run.steps[4]="running";run.note=workerRecovery?"New worker restored the durable checkpoint. Committed effect reconciled and execution continued.":"Restored checkpoint. Committed effect reconciled and skipped.";run.logs.push(workerRecovery?"worker.assign · replacement worker":"resume() · suspended execution","restore() · checkpoint","reconcileEffects() · effect already committed","effect.skip · idempotent replay");refreshRun();renderConsole();await sleep(750);run.steps[4]="success";completeRun(workerRecovery?"Recovered on new worker without restarting":"Resumed without duplicate side effect");renderConsole()}


async function resolveHeld(action){if(!run||!["POLICY_HOLD","WAITING_EXTERNAL"].includes(run.state))return;let wasPolicy=run.state==="POLICY_HOLD",sc=heldScenario(active);
if(action==="adjust"){run.logs.push(wasPolicy?"human.adjust · constrained action selected":"notification.send · reminder/request sent");run.note=wasPolicy?"Decision adjusted. CVM will resume with the constrained action.":"Reminder/request sent. Execution remains durably waiting.";if(!wasPolicy){renderConsole();refreshRun();toast("Still waiting · no worker held");return}}
else run.logs.push(wasPolicy?"human.approve · policy hold released":"event.receive · external condition satisfied");
run.state="RUNNING";run.note=wasPolicy?"Approval captured. Restoring from policy checkpoint…":"External event received. Restoring from durable wait…";run.steps[4]="running";renderConsole();refreshRun();await sleep(750);
run.logs.push("restore() · "+run.checkpoint,wasPolicy?"policy.resume · approved":"event.resume · matched correlation id","execution.continue · next semantic step");
run.steps[4]="success";active.status="Healthy";completeRun(wasPolicy?(action==="adjust"?"Adjusted decision completed":"Approved decision completed"):"Waiting execution resumed and completed");renderConsole()}
function syncDrawerControls(){if($("dfault"))$("dfault").checked=$("fault").checked;if($("dworker"))$("dworker").checked=$("worker").checked;if($("druntime"))$("druntime").value=$("runtime").value}
function syncFault(el){$("fault").checked=el.checked;toast(el.checked?"503 armed for next run":"503 simulation cleared")}
function syncWorker(el){$("worker").checked=el.checked;toast(el.checked?"Worker failure armed for next run":"Worker failure cleared")}
function syncRuntime(el){$("runtime").value=el.value;$("runtime").dispatchEvent(new Event("change"))}
$("runtime").onchange=()=>{let rt=RUNTIMES[$("runtime").value];if(run&&["SUSPENDED_ERROR","WORKER_FAILED"].includes(run.state)){let old=run.runtime;run.runtime={...rt};run.ports++;active.ports++;run.logs.push(`rebindRuntime() · ${old.model} → ${rt.model}`,"restore() · checkpoint preserved");refreshRun();if($("drawer").classList.contains("show"))renderConsole();toast((run.state==="WORKER_FAILED"?"Failed worker execution":"Suspended execution")+" moved to "+rt.model)}else toast("Next run: "+rt.model)};
$("fault").onchange=()=>{syncDrawerControls();toast($("fault").checked?"503 armed for next run":"503 simulation cleared")};
$("worker").onchange=()=>{syncDrawerControls();toast($("worker").checked?"Worker failure armed for next run":"Worker failure cleared")};
function escape(x){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
render();
</script></body></html>
