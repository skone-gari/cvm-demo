function setBusinessNav(which){document.querySelectorAll(".bside .navbtn").forEach(x=>x.classList.remove("on"));$(which==="builder"?"navBuilder":"navClaims").classList.add("on")}
function newCvmId(){let n=String(nextContainerSeq++).padStart(2,"0");return `${CVM_ROOT}/${n}`}
function renderBuilder(){setBusinessNav("builder");let d=builderDraft;$("page").innerHTML=`<div class=builder><div class=eyebrow>AGENT BUILDER</div><h1>Build from intent</h1><div class=sub>Describe the outcome. CVM evaluates the runtime stack and shows the trade-offs. You make the selections.</div><div class=stepper><div class="bstep ${builderStage==="intent"?"on":""}">1 · Intent</div><div class="bstep ${builderStage==="design"?"on":""}">2 · Evaluate stack</div><div class="bstep ${builderStage==="created"?"on":""}">3 · CVM created</div></div>${builderStage==="intent"?intentStage():builderStage==="design"?designStage(d):createdStage(d)}</div>`}
function intentStage(){return `<div class=buildergrid><div class=buildcard><h3>What should this agent do?</h3><div class=sub style="margin-bottom:9px">CVM will infer the execution requirements. No model is selected at this stage.</div><textarea id=intentText class=intentbox placeholder="Example: Review incoming property claims, validate coverage and evidence, route exceptions for human approval, then settle approved claims and maintain an audit trail."></textarea><div class=actions><button class=btn onclick=analyzeIntent()>Analyze intent</button></div></div><div class=buildcard><h3>What CVM will determine</h3><div class=kv><div>Execution shape</div><b>tools · waits · external effects</b><div>Durability</div><b>checkpoint + replay boundaries</b><div>Governance</div><b>approval + policy gates</b><div>Runtime</div><b>model · evals · guardrails · state</b></div><div class=reasonbox>The model is deliberately unbound until the workload is evaluated.</div></div></div>`}
function analyzeIntent(){let t=$("intentText").value.trim();if(t.length<15){toast("Add a little more detail to the intent");return}let uid=newCvmId();builderDraft={uid,appId:`agent-${uid.split("/")[1]}.app.cvm`,intent:t,model:null,eval:"braintrust",guardrail:"nemo",state:"cvm-state"};builderStage="design";renderBuilder()}
function radioRows(options,field){return options.map((o,i)=>`<tr class="${o.rec?"recommended":""}"><td><input class=pick type=radio name="${field}" value="${o.id}" ${builderDraft[field]===o.id?"checked":""} onchange="builderDraft.${field}=this.value"></td><td><b>${o.name}</b>${o.rec?'<span class=rec>RECOMMENDED</span>':''}<div class=why>${o.fit}</div></td><td class=why>${o.why}</td></tr>`).join("")}
function designStage(d){return `<div class=buildcard><div style="display:flex;justify-content:space-between;align-items:center"><div><h3>Proposed CVM</h3><div class=sub>${escapeHtml(d.intent)}</div></div><span class=newid>${d.uid}</span></div></div>
<div class=buildcard><h3>Model evaluation</h3><div class=sub>Modeled workload comparison. CVM does not select the model for you.</div><div class=tablebox style="margin-top:9px"><table class=choiceTable><thead><tr><th></th><th>Model</th><th>Cost</th><th>Accuracy</th><th>Latency</th><th>Availability</th><th>Best fit</th></tr></thead><tbody>${MODEL_OPTIONS.map(o=>`<tr><td><input class=pick type=radio name=model value="${o.id}" ${d.model===o.id?"checked":""} onchange="builderDraft.model=this.value"></td><td><b>${o.name}</b><div class=why>${o.provider}</div></td><td>${o.cost}</td><td><span class=score>${o.accuracy}%</span></td><td>${o.latency}</td><td>${o.availability}</td><td class=why>${o.why}</td></tr>`).join("")}</tbody></table></div><div class=reasonbox>These are demo workload scores, not vendor benchmarks. The point is that CVM evaluates the dimensions and exposes the trade-off rather than silently binding a model.</div></div>
<div class=buildergrid><div class=buildcard><h3>Evals</h3><table class=choiceTable><tbody>${radioRows(STACK_OPTIONS.evals,"eval")}</tbody></table></div><div class=buildcard><h3>Guardrails / policy</h3><table class=choiceTable><tbody>${radioRows(STACK_OPTIONS.guardrails,"guardrail")}</tbody></table></div></div>
<div class=buildcard><h3>State & durability</h3><table class=choiceTable><tbody>${radioRows(STACK_OPTIONS.state,"state")}</tbody></table><div class=actions><button class=btn onclick=createAgent()>Create CVM container</button><button class="btn secondary" onclick="builderStage='intent';builderDraft=null;renderBuilder()">Back</button></div></div>`}
function chosen(list,id){return list.find(x=>x.id===id)}
function createAgent(){let d=builderDraft;if(!d.model){toast("Select a model before creating the CVM");return}let m=chosen(MODEL_OPTIONS,d.model),ev=chosen(STACK_OPTIONS.evals,d.eval),g=chosen(STACK_OPTIONS.guardrails,d.guardrail),st=chosen(STACK_OPTIONS.state,d.state);d.selected={model:m,eval:ev,guardrail:g,state:st};customContainers.push({uid:d.uid,appId:d.appId,label:"Intent-built agent",intent:d.intent,executions:0,binding:"custom",customRuntime:m.provider+" · "+m.name});builderStage="created";renderBuilder();toast(`${d.uid} added to CVM fabric`)}
function createdStage(d){let x=d.selected;return `<div class=buildcard><div class=eyebrow>CREATED</div><h1 style="font-size:19px">${d.appId}</h1><span class=newid>${d.uid}</span><div class=buildsummary style="margin-top:14px"><div class=sumcell><span>Model</span><b>${x.model.provider} · ${x.model.name}</b></div><div class=sumcell><span>Evals</span><b>${x.eval.name}</b></div><div class=sumcell><span>Guardrails</span><b>${x.guardrail.name}</b></div><div class=sumcell><span>State</span><b>${x.state.name}</b></div></div><div class=reasonbox>${x.eval.why}<br>${x.guardrail.why}<br>${x.state.why}</div><div class=actions><button class=btn onclick="rtTab='fabric';document.querySelectorAll('.rtabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab==='fabric'));renderRuntime()">View in CVM Fabric</button><button class="btn secondary" onclick="builderStage='intent';builderDraft=null;renderBuilder()">Build another</button></div></div>`}
function renderClaims(){setBusinessNav("claims");let q=($("claimSearch")?.value||"").toLowerCase(),rows=claims.filter(c=>!q||`${c.claimId} ${c.customer} ${c.incidentType}`.toLowerCase().includes(q));$("page").innerHTML=`<div class=eyebrow>CLAIMS</div><h1>Claims queue</h1><div class=sub>Adjudicate claims while CVM persists every execution underneath.</div><div class=metrics><div class=metric><strong>${claims.length}</strong><span>Open / recent</span></div><div class=metric><strong>${claims.filter(c=>c.status==="POLICY_HOLD").length}</strong><span>Approvals</span></div><div class=metric><strong>${claims.filter(c=>c.status==="FAILED_RETRYABLE").length}</strong><span>Retryable</span></div><div class=metric><strong>${claims.filter(c=>c.status==="SETTLED").length}</strong><span>Settled</span></div></div><div class=toolbar><input id=claimSearch class="input search" placeholder="Search claim or customer" value="${q}"></div><div class=tablebox><table><thead><tr><th>Claim</th><th>Customer</th><th>Incident</th><th>Amount</th><th>Status</th></tr></thead><tbody>${rows.map(c=>`<tr data-id="${c.claimId}"><td><b>${c.claimId}</b></td><td>${c.customer}</td><td>${c.incidentType}</td><td>${money(c.claimedAmount)}</td><td><span class="badge ${c.status}">${c.status.replaceAll("_"," ")}</span></td></tr>`).join("")}</tbody></table></div>`;$("claimSearch").oninput=renderClaims;$("page").querySelectorAll("[data-id]").forEach(r=>r.onclick=()=>openClaim(r.dataset.id))}
function openClaim(id){active=claimBy(id);renderRuntime();let c=active;$("drawer").innerHTML=`<button class=close onclick=closeDrawer()>×</button><div class=eyebrow>CLAIM ADJUDICATION</div><div class=title><h1>${c.customer}</h1><span class="badge ${c.status}">${c.status.replaceAll("_"," ")}</span></div><div class=sub>${c.claimId} · ${c.incidentType}</div><div class=card><h3>Claim</h3><div class=kv><div>Claimed amount</div><b>${money(c.claimedAmount)}</b><div>Autonomous limit</div><b>${money(c.policyThreshold)}</b><div>CVM container</div><b>${c.containerUid} · ${c.containerId}</b><div>Runtime</div><b>${c.runtime?`${c.runtime.cloud} · ${c.runtime.model}`:"Not started"}</b>${c.payment?`<div>Payment effect</div><b>${c.payment.id} · COMMITTED</b>`:""}</div></div>${c.status==="DRAFT"?`<div class=actions><button class=btn onclick="settle('${c.claimId}')">Trigger settlement</button></div>`:""}${c.status==="POLICY_HOLD"?`<div class=card><h3>Human approval required</h3><div class=sub>Requested settlement exceeds autonomous authority. Resume target: <b>${selectedRuntime().cloud} · ${selectedRuntime().model}</b></div><div class=actions><button class=btn onclick="approve('${c.claimId}',${c.claimedAmount})">Approve ${money(c.claimedAmount)}</button><button class="btn secondary" onclick="adjust('${c.claimId}')">Adjust & approve</button></div></div>`:""}${c.status==="FAILED_RETRYABLE"?`<div class=card><h3>Runtime suspended</h3><div class=sub>Payment committed. Claims API update failed. Current resume target: <b>${selectedRuntime().cloud} · ${selectedRuntime().model}</b>.</div></div>`:""}${c.status==="SETTLED"?`<div class=card><h3>Settlement complete</h3><div class=kv><div>Approved</div><b>${money(c.approvedAmount??c.claimedAmount)}</b><div>Transaction</div><b>${c.transactionId||"Historical"}</b></div></div>`:""}`;$("drawer").classList.add("show")}
function closeDrawer(){$("drawer").classList.remove("show")}function selectedRuntime(){return{...CLOUDS[$("cloud").value]}}
async function migrateActiveRuntime(){let target=selectedRuntime(),c=active;if(!c||!c.transactionId){toast(`Target runtime: ${target.cloud} / ${target.model}`);renderRuntime();return}let old=c.runtime;if(old&&old.cloud===target.cloud&&old.provider===target.provider&&old.model===target.model){toast(`Runtime already ${target.cloud} / ${target.model}`);return}c.runtime={...target};c.migrationCount=(c.migrationCount||0)+1;c.runtimeHistory=c.runtimeHistory||[];c.runtimeHistory.push({...target,at:now(),reason:"runtime.switch"});log(c,"INFO","interface.rebindRuntime()",`${old?old.cloud+"/"+old.model:"unbound"} → ${target.cloud}/${target.model}`,64);if(c.checkpoint)log(c,"INFO","interface.restore()",`checkpoint=${c.checkpoint.name} target=${target.provider}/${target.model}`,42);renderClaims();renderRuntime();if($("drawer").classList.contains("show"))openClaim(c.claimId);toast(`Active execution moved to ${target.cloud} / ${target.model}`)}
async function settle(id){if(busy)return;let c=claimBy(id);active=c;busy=true;closeDrawer();c.runtime=selectedRuntime();c.runtimeHistory=[{...c.runtime,at:now(),reason:"transaction.start"}];c.migrationCount=0;c.transactionId="tx_"+rnd(8);c.status="PROCESSING";c.logs=[];c.executionTrace=[];c.payment=null;c.checkpoint=null;c.snapshotCounter=0;resetSteps(c);renderClaims();renderRuntime();setStep(c,"policy","running");log(c,"INFO","policy.evaluate",`amount=${c.claimedAmount} threshold=${c.policyThreshold}`);await sleep(550);setStep(c,"policy","success");if(c.claimedAmount>c.policyThreshold){c.status="POLICY_HOLD";c.checkpoint={name:"policy_hold",hash:hash(),createdAt:now(),state:"WAITING_HUMAN"};c.snapshotCounter++;log(c,"INFO","checkpoint.write",`${c.checkpoint.name} ${c.checkpoint.hash}`,142);log(c,"WARN","transaction.wait","human.approval required",91);busy=false;renderClaims();openClaim(c.claimId);return}await continueSettlement(c,c.claimedAmount)}
async function continueSettlement(c,amount){c.approvedAmount=amount;c.runtime=selectedRuntime();setStep(c,"model","running");log(c,"INFO","model.invoke",`${c.runtime.provider}/${c.runtime.model}`);await sleep(650);if($("workerFail").checked){log(c,"ERROR","worker.lost","worker heartbeat expired",17);await sleep(450);log(c,"INFO","worker.reassign","execution restored on worker-07",103)}setStep(c,"model","success");setStep(c,"payment","running");log(c,"INFO","tool.begin","PaymentService.issue",11);await sleep(600);if(!c.payment)c.payment={id:"pay_txn_"+rnd(10),idempotencyKey:`${c.claimId.toLowerCase()}_settlement_v1`,amount,committed:true};log(c,"INFO","effect.commit",`${c.payment.id} key=${c.payment.idempotencyKey}`,384);setStep(c,"payment","success");setStep(c,"snapshot","running");await sleep(350);c.snapshotCounter++;c.checkpoint={name:"after_payment",hash:hash(),createdAt:now(),state:"PAYMENT_COMMITTED"};log(c,"INFO","interface.checkpoint()",`${c.checkpoint.name} ${c.checkpoint.hash}`,118);setStep(c,"snapshot","success");setStep(c,"sync","running");log(c,"INFO","tool.begin","ClaimsService.update",9);await sleep(550);if($("f503").checked){setStep(c,"sync","error");c.status="FAILED_RETRYABLE";log(c,"ERROR","tool.error","ClaimsService.update HTTP 503",527);log(c,"WARN","interface.suspend()","checkpoint=after_payment · claims.update HTTP 503",33);busy=false;renderClaims();openClaim(c.claimId);return}setStep(c,"sync","success");log(c,"INFO","tool.end","ClaimsService.update HTTP 200",243);c.status="SETTLED";log(c,"INFO","transaction.complete",c.transactionId,22);busy=false;renderClaims();openClaim(c.claimId)}
function approve(id,amount){let c=claimBy(id);active=c;closeDrawer();c.status="PROCESSING";setStep(c,"policy","success");log(c,"INFO","human.approval",`approved=${amount}`,71);busy=true;renderClaims();continueSettlement(c,amount)}
function adjust(id){let c=claimBy(id);$("drawer").innerHTML=`<button class=close onclick=closeDrawer()>×</button><div class=eyebrow>ADJUST & APPROVE</div><h1>${c.customer}</h1><div class=card><div class=kv><div>Requested</div><b>${money(c.claimedAmount)}</b><div>Autonomous limit</div><b>${money(c.policyThreshold)}</b></div><div class=sub style="margin-top:12px">Approved amount</div><input id=adjAmt class=input type=number value="${c.claimedAmount}" style="width:100%;margin-top:5px"><div class=sub style="margin-top:10px">Reason</div><textarea id=adjReason class=input style="width:100%;height:70px;margin-top:5px" placeholder="Enter adjustment rationale"></textarea><div class=actions><button class=btn onclick="commitAdjust('${id}')">Adjust & approve</button></div></div>`}
function commitAdjust(id){let c=claimBy(id),a=Number($("adjAmt").value),r=$("adjReason").value.trim();if(!(a>0)||!r){toast("Enter an amount and rationale");return}c.adjustReason=r;approve(id,a)}
async function resume(){let c=active;if(!c||c.status!=="FAILED_RETRYABLE"||busy)return;busy=true;let target=selectedRuntime(),old=c.runtime;c.runtime={...target};if(!old||old.model!==target.model||old.provider!==target.provider){c.migrationCount=(c.migrationCount||0)+1;c.runtimeHistory.push({...target,at:now(),reason:"resume.rebind"});log(c,"INFO","runtime.rebind",`${old?old.cloud+"/"+old.model:"unbound"} → ${target.cloud}/${target.model}`,51)}log(c,"INFO","interface.resume()",`checkpoint=${c.checkpoint.name}`,31);setStep(c,"sync","idle");await sleep(450);log(c,"INFO","checkpoint.restore",c.checkpoint.hash,96);await sleep(400);log(c,"INFO","model.route",`${c.runtime.provider}/${c.runtime.model} · resumed execution`,73);await sleep(300);setStep(c,"payment","skipped");log(c,"INFO","interface.reconcileEffects()",`${c.payment.id} already COMMITTED`,84);log(c,"INFO","effect.skip",`idempotency_key=${c.payment.idempotencyKey}`,12);await sleep(450);setStep(c,"sync","running");log(c,"INFO","tool.retry","ClaimsService.update attempt=2",8);await sleep(650);setStep(c,"sync","success");log(c,"INFO","tool.end","ClaimsService.update HTTP 200",219);c.status="SETTLED";log(c,"INFO","transaction.complete",c.transactionId,19);busy=false;renderClaims();renderRuntime();openClaim(c.claimId)}
function pipeline(c){let labels=[["policy","Policy"],["model","Model"],["payment","Effect"],["snapshot","Snapshot"],["sync","Sync"]];return`<div class=pipeline>${labels.map((x,i)=>`${i?'<div class=edge></div>':''}<div class="pnode ${c.stepStates[x[0]]}"><div class=dot>${c.stepStates[x[0]]==="success"?"✓":c.stepStates[x[0]]==="error"?"!":c.stepStates[x[0]]==="skipped"?"↷":i+1}</div><span>${x[1]}</span></div>`).join("")}</div>`}
function rawState(c){return JSON.stringify({cvmId:CVM_ROOT,container:{uid:c.containerUid,appId:c.containerId},transactionId:c.transactionId,claimId:c.claimId,status:c.status,runtime:c.runtime,policy:{threshold:c.policyThreshold,claimedAmount:c.claimedAmount,approvedAmount:c.approvedAmount,humanReason:c.adjustReason},externalEffects:c.payment?[{type:"payment",effectId:c.payment.id,idempotencyKey:c.payment.idempotencyKey,committed:c.payment.committed,amount:c.payment.amount}]:[],checkpoint:c.checkpoint,snapshotCounter:c.snapshotCounter,runtimeHistory:c.runtimeHistory,migrationCount:c.migrationCount,stepStates:c.stepStates},null,2)}
function escapeHtml(x){return x.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function containerBinding(x){if(x.customRuntime)return x.customRuntime;if(x.appId==="claims.app.cvm"){let r=active.runtime||selectedRuntime();return `${r.provider} · ${r.model}`}let r=CLOUDS[x.binding]||CLOUDS.aws;return `${r.provider} · ${r.model}`}
function selectContainer(appId){let x=allContainers().find(z=>z.appId===appId);if(!x)return;if(appId==="claims.app.cvm"){rtTab="trace";document.querySelectorAll(".rtabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab==="trace"));renderRuntime()}else toast(`${x.label} · ${x.executions} executions · ${containerBinding(x)}`)}
function fabricView(c){return `<div class=rtop><div><div class=eyebrow style="color:#6f8ba5">CVM FABRIC</div><h2>${CVM_ROOT}</h2><div class=rsub>One shared fabric · cloud · on-prem · edge</div></div><span class=rstatus>${allContainers().length} CONTAINERS</span></div>
<div class=fabricgrid>${allContainers().map(x=>`<div class="cvmcard ${x.appId===c.containerId?'active':''}" data-cvm-app="${x.appId}"><div class=cid>${x.uid}</div><b>${x.appId}</b><small>${x.label}<br>${x.executions} executions · ${containerBinding(x)}</small></div>`).join("")}</div>
<div class=fabricline></div><div class=runtimebar><div style="display:flex;justify-content:space-between"><b style="font-size:9px">CVM Runtime</b><span class=deckid>${CVM_ROOT}</span></div><div class=rsub>One shared fabric across compatible targets</div><div class=layers><div>MODELS</div><div>HARDWARE</div><div>DATA</div><div>LOCATION</div></div></div>
<div class=rpanel><h3>Container boundary</h3><div class=trace><div>INTENT       <span class=ok>${c.containerId==="claims.app.cvm"?"settle and manage claims":"—"}</span></div><div>CONTEXT      Northstar policy + claim</div><div>STATE        ${c.checkpoint?"durable · snapshot #"+c.snapshotCounter:"ready"}</div><div>LEARNING     lineage · ln_${c.claimId.slice(-5).toLowerCase()}</div></div></div>`}
function runtimeInterface(c){let r=c.runtime||selectedRuntime();return `<div class=iface><div class=ifacehead><span>CVM RUNTIME INTERFACE</span><span class=deckid>${c.containerUid}</span></div><div class=ifacerow><div class=ifacecell><b>execute()</b><br>reason + invoke</div><div class=ifacecell><b>checkpoint()</b><br>persist semantic state</div><div class=ifacecell><b>suspend() / resume()</b><br>durable continuation</div><div class=ifacecell><b>reconcileEffects()</b><br>idempotent side-effects</div><div class=ifacecell><b>rebindRuntime()</b><br>portable execution</div><div class=ifacecell><b>restore()</b><br>hydrate checkpoint</div></div></div><div class=bindinggrid><div class=binding><span>Model</span><b>${r.model}</b></div><div class=binding><span>Hardware</span><b>${r.cloud}</b></div><div class=binding><span>Data</span><b>Northstar</b></div><div class=binding><span>Location</span><b>${r.region}</b></div></div>`}
function renderRuntime(){let c=active,head=`<div class=rtop><div><div class=eyebrow style="color:#6f8ba5">CVM CONTAINER · ${c.containerUid}</div><h2>${c.containerId}</h2><div class=rsub>${c.transactionId||"No active transaction"} · ${c.claimId} · ${c.customer}${c.runtime?` · ${c.runtime.cloud}/${c.runtime.model}`:""}</div></div><span class=rstatus>${c.status}</span></div>`;if(rtTab==="fabric")$("rbody").innerHTML=fabricView(c);if(rtTab==="trace")$("rbody").innerHTML=head+runtimeInterface(c)+pipeline(c)+`<div class=rpanel><h3>Execution inspector</h3><div class=trace>${c.payment?`<div class=ok>effect ${c.payment.id} · COMMITTED</div><div class=dim>idempotency ${c.payment.idempotencyKey}</div>`:'<div class=dim>No external effects committed yet.</div>'}${c.checkpoint?`<div class=info>checkpoint ${c.checkpoint.name} · ${c.checkpoint.hash}</div>`:""}</div>${c.status==="FAILED_RETRYABLE"?`<div style="margin-top:10px"><button class="rbtn primary" onclick=resume()>Resume / Replay on ${selectedRuntime().model}</button><div class=rsub style="margin-top:6px">Verifies committed effects before retrying from after_payment.</div></div>`:""}</div><div class=rpanel><h3>Infrastructure</h3><div class=trace><div>runtime      <span class=ok>CVM 2.4 healthy</span></div><div>workers      12 / 12 ready</div><div>state store  quorum healthy</div><div>checkpoint   p95 118µs</div><div>binding      ${c.runtime?c.runtime.provider+"/"+c.runtime.model:"unbound"}</div><div>ports        ${c.migrationCount||0}</div></div></div>`;if(rtTab==="state")$("rbody").innerHTML=head+`<div class=rpanel><h3>Raw transaction state <button class=rbtn style="float:right" onclick=copyState()>Copy JSON</button></h3><pre class="trace json">${escapeHtml(rawState(c))}</pre></div>`;if(rtTab==="logs")$("rbody").innerHTML=head+`<div class=rpanel><h3>Live execution log</h3><div id=logbox class="trace logbox">${c.logs.length?c.logs.map(x=>`<div class="${x.level==="ERROR"?"err":x.level==="WARN"?"info":x.event.includes("commit")||x.event.includes("complete")?"ok":"dim"}">${x.ts}  ${String(x.latency).padStart(4)}µs  ${x.event.padEnd(22)} ${escapeHtml(x.detail)}</div>`).join(""):'<div class=dim>Waiting for execution events…</div>'}</div></div>`;if(rtTab==="checkpoints")$("rbody").innerHTML=head+`<div class=rpanel><h3>Durable snapshots</h3>${c.checkpoint?`<div class=checkpoint><span>${c.checkpoint.name}</span><b>${c.checkpoint.hash}</b></div><div class=checkpoint><span>snapshot counter</span><b>${c.snapshotCounter}</b></div><div class=checkpoint><span>persisted state</span><b>${c.checkpoint.state}</b></div>`:'<div class=trace>No checkpoint written.</div>'}</div>`;let lb=$("logbox");if(lb)lb.scrollTop=lb.scrollHeight;document.querySelectorAll("[data-cvm-app]").forEach(el=>el.onclick=()=>selectContainer(el.dataset.cvmApp))}
function copyState(){navigator.clipboard?.writeText(rawState(active));toast("Raw state copied")}
document.querySelectorAll(".rtabs button").forEach(b=>b.onclick=()=>{rtTab=b.dataset.tab;document.querySelectorAll(".rtabs button").forEach(x=>x.classList.toggle("on",x===b));renderRuntime()});$("navClaims").onclick=()=>renderClaims();$("navBuilder").onclick=()=>renderBuilder();$("cloud").onchange=migrateActiveRuntime;$("f503").onchange=()=>toast($("f503").checked?"Claims API fault armed":"Claims API fault cleared");$("workerFail").onchange=()=>toast($("workerFail").checked?"Worker failure armed":"Worker failure cleared");renderClaims();renderRuntime();
</script></body></html>
