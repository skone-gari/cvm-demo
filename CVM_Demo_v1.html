<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CVM Control Plane</title>
<style>
:root{--navy:#102746;--blue:#3454d1;--ink:#26364b;--muted:#748294;--line:#e1e7ed;--bg:#f5f7f9;--green:#25845e;--amber:#b67a1c;--red:#b43b31;--cyan:#3c8aa8}
*{box-sizing:border-box}body{margin:0;background:#dfe5ea;font:14px Inter,Calibri,Arial,sans-serif;color:var(--ink)}button{font-family:inherit}.app{height:100vh;max-width:1540px;margin:auto;background:white;display:flex;flex-direction:column}.tabs{height:45px;background:#e7ecf1;display:flex;align-items:end;padding:0 14px;gap:5px}.tabs button{height:35px;min-width:190px;border:0;border-radius:8px 8px 0 0;background:#d6dee6;color:#607080;text-align:left;padding:0 14px;font-size:12px;font-weight:700;cursor:pointer}.tabs button.on{background:#fff;color:var(--navy)}.shell{display:flex;flex:1;min-height:0}.side{width:220px;background:var(--navy);color:#cad4df;padding:22px 14px;display:flex;flex-direction:column}.logo{font-size:21px;font-weight:800;color:#fff;padding:0 10px 22px}.logo small{display:block;font-size:10px;font-weight:400;color:#9cafc1}.nav button{display:block;width:100%;border:0;background:none;color:#c8d2dc;text-align:left;padding:10px 11px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer}.nav button.on,.nav button:hover{background:#ffffff14;color:#fff}.tenant{margin-top:auto;border-top:1px solid #ffffff20;padding:14px 10px 0;font-size:10px}.tenant b{display:block;color:white;font-size:11px}.main{flex:1;overflow:auto;background:var(--bg)}.top{height:58px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;position:sticky;top:0;z-index:3}.crumb{font-size:11px;color:#788596}.live{margin-left:auto;font-size:10px}.live:before{content:"";display:inline-block;width:7px;height:7px;background:#4ab27a;border-radius:50%;margin-right:6px}.page{max-width:1240px;padding:28px 30px 45px}.eye{font-size:9px;font-weight:800;letter-spacing:.1em;color:var(--blue)}h1{font-size:27px;color:var(--navy);margin:5px 0}.sub{font-size:12px;color:var(--muted)}.title{display:flex;align-items:center;gap:10px}.card,.metric,.artifact,.deploy{background:#fff;border:1px solid var(--line);border-radius:9px}.card{padding:18px;margin-top:16px}.card h3{margin:0 0 12px;color:var(--navy);font-size:14px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-top:17px}.metric{padding:15px}.metric strong{display:block;font-size:22px;color:var(--navy)}.metric span{font-size:10px;color:#7d8997}.tablebox{background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:17px}.filters{padding:11px;border-bottom:1px solid var(--line);display:flex;gap:7px}.filter{border:1px solid #d7dee5;background:#fff;border-radius:6px;padding:7px 10px;font-size:11px;color:#596778}.search{width:245px}table{width:100%;border-collapse:collapse;font-size:11px}th{text-align:left;background:#fafbfc;color:#7c8896;font-size:9px;text-transform:uppercase;letter-spacing:.05em}th,td{padding:11px 13px;border-bottom:1px solid #edf0f3}tbody tr{cursor:pointer}tbody tr:hover{background:#f8faff}td b{color:var(--navy)}.status{display:inline-block;padding:4px 8px;border-radius:999px;font-size:9px;font-weight:800}.green{background:#eaf8f1;color:var(--green)}.amber{background:#fff6df;color:var(--amber)}.red{background:#fff0ee;color:var(--red)}.blue{background:#eef2ff;color:var(--blue)}.btn{border:0;background:var(--blue);color:white;border-radius:6px;padding:9px 13px;font-size:10px;font-weight:800;cursor:pointer}.btn.ghost{background:white;color:var(--navy);border:1px solid #d4dde5}.btn.danger{background:white;color:var(--red);border:1px solid #e6c5c0}.btn:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:8px;margin-top:15px}.kv{display:grid;grid-template-columns:125px 1fr;gap:9px;font-size:11px}.kv div:nth-child(odd){color:#7e8a98}.label{font-size:9px;color:#82909e;letter-spacing:.06em;text-transform:uppercase}.big{font-size:20px;font-weight:800;color:var(--navy);margin:4px 0 14px}.hero{margin-top:17px;background:linear-gradient(135deg,#102746,#1d4778);border-radius:10px;padding:22px;color:white;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:220px;height:220px;border:1px solid #ffffff18;border-radius:50%;right:-60px;top:-100px}.hero h2{font-size:22px;margin:4px 0}.hero .sub{color:#cbd8e5}.kpis{display:flex;gap:24px;margin-top:14px}.kpis b{display:block;color:inherit;font-size:16px}.kpis span{font-size:8px;color:#8795a4;text-transform:uppercase}.hero .kpis span{color:#b9c8d8}.artifactGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:17px}.artifact{padding:17px;cursor:pointer;transition:.15s}.artifact:hover{transform:translateY(-2px);box-shadow:0 8px 22px #10274612}.artifact h3{margin:4px 0;color:var(--navy)}.layers{margin-top:14px}.layer{height:31px;border:1px solid #dce3ea;background:#fafbfd;margin-top:-1px;padding:8px 10px;font-size:9px;display:flex;justify-content:space-between}.layer:first-child{border-radius:6px 6px 0 0}.layer:last-child{border-radius:0 0 6px 6px}.digest{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9px;color:#7b8795}.deployGrid{display:grid;grid-template-columns:1.15fr .85fr;gap:13px;margin-top:17px}.deploy{padding:18px}.topology{height:170px;position:relative}.topology svg{width:100%;height:100%}.progressWrap{margin-top:13px}.progressHead{display:flex;justify-content:space-between;font-size:10px;color:#677587;margin-bottom:6px}.progress{height:8px;background:#e8edf2;border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3454d1,#6680df);border-radius:8px;transition:width .35s}.checks{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:13px}.check{background:#f1faf5;color:var(--green);padding:9px;border-radius:6px;font-size:10px;font-weight:700}.drawer{position:fixed;right:0;top:45px;bottom:0;width:450px;background:#fff;box-shadow:-12px 0 35px #10274622;z-index:20;padding:24px;display:none;overflow:auto}.drawer.show{display:block}.close{float:right;border:0;background:none;font-size:20px;color:#738092;cursor:pointer}.overlay{position:fixed;inset:45px 0 0;background:#10274655;z-index:25;display:none;place-items:center}.overlay.show{display:grid}.modal{width:575px;background:white;border-radius:10px;padding:22px}.modal h2{margin:0;color:var(--navy)}.exec{background:white;border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:16px}.exec svg{display:block;width:100%;height:160px}.node{cursor:pointer}.console{background:#101923;color:#d4dde6;border-radius:8px;padding:15px;font:10px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;min-height:230px;margin-top:13px;white-space:pre-wrap}.console .ok{color:#70d6a5}.console .err{color:#ff8b82}.console .dim{color:#8090a0}.console .new{color:#8fb0ff}.tabs2{display:flex;gap:17px;border-bottom:1px solid var(--line);margin-top:17px}.tabs2 button{border:0;background:none;padding:9px 0;font-size:10px;font-weight:800;color:#7b8795;cursor:pointer}.tabs2 button.on{color:var(--blue);border-bottom:2px solid var(--blue)}.move{display:grid;grid-template-columns:1fr 50px 1fr;align-items:center;gap:10px;margin-top:17px}.cloud{border:1px solid var(--line);border-radius:8px;padding:15px}.cloud h3{margin:3px 0;color:var(--navy)}.arrow{text-align:center;font-size:24px;color:#9aa7b4}.timeline{border-left:2px solid #dce3ea;margin:15px 0 0 7px;padding-left:16px}.event{position:relative;margin:0 0 14px;font-size:10px}.event:before{content:"";position:absolute;width:7px;height:7px;background:var(--green);border-radius:50%;left:-21px;top:3px}.event.err:before{background:var(--red)}.event.am:before{background:var(--amber)}.toast{position:fixed;right:25px;bottom:25px;background:var(--navy);color:white;padding:12px 16px;border-radius:7px;display:none;z-index:40;font-size:11px}.foot{font-size:8px;color:#a0928d;margin-top:28px}
</style></head><body><div class=app><div class=tabs><button id=nTab class=on>Northstar Claims</button><button id=cTab>CVM Control Plane</button></div><div class=shell><aside class=side><div id=logo class=logo></div><div id=nav class=nav></div><div class=tenant><b>Northstar Insurance</b>Production</div></aside><main class=main><div class=top><span id=crumb class=crumb></span><div style="margin-left:auto;display:flex;align-items:center;gap:9px"><button class="filter" onclick=openCommand()>⌘K&nbsp;&nbsp;Search / command</button><span class=live style="margin-left:0">Production</span></div></div><div id=page class=page></div></main></div></div><div id=drawer class=drawer></div><div id=overlay class=overlay><div id=modal class=modal></div></div><div id=toast class=toast></div>
<script>
const $=x=>document.getElementById(x);
const S={product:"north",route:"Claims",mariaRecovered:false,david:null,davidAmount:12400,image:"claims-agent:v42",model:"Claude Sonnet",provider:"AWS Bedrock",cloud:"AWS",region:"us-west-2",instances:12,testRan:false,moveDone:false,prevDeploy:null,pendingResumed:false,builderImage:null,mariaFollowup:null};
const claims={"CLM-48291":["Maria Chen","Auto glass","$1,840"],"CLM-48307":["David Park","Collision","$12,400"],"CLM-48341":["Sarah Miller","Water damage","$28,700"],"CLM-48352":["James Wilson","Theft","$7,650"],"CLM-48368":["Elena Garcia","Collision","$4,220"]};
function status(id){if(id=="CLM-48291")return S.mariaRecovered?"Complete":"Needs recovery";if(id=="CLM-48307")return S.david?(S.david=="Denied"?"Denied":`Approved · $${S.davidAmount.toLocaleString()}`):"Approval required";if(id=="CLM-48341")return"Waiting on documents";if(id=="CLM-48352")return"Adjuster review";return"Complete"}
function badge(x){let c=x.startsWith("Approved")||["Complete","Recovered","Ready","Healthy"].includes(x)?"green":x=="Denied"||x=="Needs recovery"?"red":x.includes("Waiting")||x.includes("Approval")||x.includes("review")||x=="Draining"?"amber":"blue";return `<span class="status ${c}">${x}</span>`}
function foot(){return`<div class=foot>PATENT IN PROGRESS | CONFIDENTIAL & PROPRIETARY | ALL RIGHTS RESERVED | NOT FOR DISTRIBUTION</div>`}
function toast(x){$("toast").textContent=x;$("toast").style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>$("toast").style.display="none",1800)}function closeDrawer(){$("drawer").classList.remove("show")}function closeModal(){$("overlay").classList.remove("show")}
$("nTab").onclick=()=>product("north");$("cTab").onclick=()=>product("cvm");
function product(p){S.product=p;$("nTab").classList.toggle("on",p=="north");$("cTab").classList.toggle("on",p=="cvm");$("logo").innerHTML=p=="north"?'Northstar<small>Claims Operations</small>':'CVM<small>Control Plane</small>';go(p=="north"?"Claims":"Deployments")}
function nav(items,r){$("nav").innerHTML=items.map(x=>`<button data-r="${x}" class="${x==r?"on":""}">${x}</button>`).join("");$("nav").querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.r))}
function go(r){S.route=r;closeDrawer();if(S.product=="north"){nav(["Overview","Claims","Tasks","Approvals","Customers","Policies"],r);({Overview:nOverview,Claims:nClaims,Tasks:nTasks,Approvals:nApprovals,Customers:nCustomers,Policies:nPolicies}[r]||nClaims)()}else{nav(["Deployments","Builder","Images","Transactions","Policies","Models","Tools","Logs"],r);({Deployments:deployments,Builder:builder,Images:images,Transactions:transactions,Policies:cPolicies,Models:models,Tools:tools,Logs:logs}[r]||deployments)()}}
function nOverview(){$("crumb").textContent="Northstar / Overview";$("page").innerHTML=`<div class=eye>NORTHSTAR CLAIMS</div><h1>Claims operations</h1><div class=sub>Live production view</div><div class=hero><div class=eye style="color:#9eb7ff">TODAY</div><h2>${S.mariaRecovered?"Operations healthy":"One runtime exception needs attention"}</h2><div class=sub>${S.mariaRecovered?"All claim workflows are moving normally.":"Maria Chen's payment completed, but the claim update did not."}</div><div class=kpis><div><b>47</b><span>Open claims</span></div><div><b>84%</b><span>Straight-through</span></div><div><b>4.7h</b><span>Median cycle</span></div></div></div><div class=metrics><div class=metric><strong>126</strong><span>Processed this week</span></div><div class=metric><strong>$186K</strong><span>Open exposure</span></div><div class=metric><strong>11</strong><span>Awaiting documents</span></div><div class=metric><strong>${S.mariaRecovered?0:1}</strong><span>Runtime exceptions</span></div></div>${foot()}`}
function nClaims(){$("crumb").textContent="Northstar / Claims";$("page").innerHTML=`<div class=eye>CLAIMS</div><h1>Claims</h1><div class=sub>Open and recently processed claims.</div><div class=tablebox><div class=filters><input class="filter search" placeholder="Search claims"><button class=filter>Status ▾</button><button class=filter>Type ▾</button></div><table><thead><tr><th>Claim</th><th>Customer</th><th>Type</th><th>Amount</th><th>Status</th></tr></thead><tbody>${Object.entries(claims).map(([id,c])=>`<tr data-id="${id}"><td><b>${id}</b></td><td>${c[0]}</td><td>${c[1]}</td><td>${c[2]}</td><td>${badge(status(id))}</td></tr>`).join("")}</tbody></table></div>${foot()}`;$("page").querySelectorAll("[data-id]").forEach(x=>x.onclick=()=>claim(x.dataset.id))}
function claim(id){if(id=="CLM-48291"){maria();return}if(id=="CLM-48307"){david();return}let c=claims[id];$("crumb").textContent=`Claims / ${id}`;$("page").innerHTML=`<div class=eye>CLAIM</div><div class=title><h1>${c[0]}</h1>${badge(status(id))}</div><div class=sub>${id} · ${c[1]}</div><div class=card><div class=kpis><div><b>${c[2]}</b><span>Claim amount</span></div><div><b>${id=="CLM-48341"?"Documents":id=="CLM-48352"?"Review":"Closed"}</b><span>Current stage</span></div></div></div><div class=card><h3>${id=="CLM-48341"?"Waiting for contractor invoice":id=="CLM-48352"?"Adjuster review":"Claim completed"}</h3><div class=sub>${id=="CLM-48341"?"Water mitigation report and photos are received. Contractor invoice is outstanding.":id=="CLM-48352"?"Police report, coverage, and vehicle details have been verified.":"Settlement completed successfully."}</div><div class=actions>${id=="CLM-48341"?'<button class=btn onclick="toast(\'Reminder sent\')">Send reminder</button>':id=="CLM-48352"?'<button class=btn onclick="toast(\'Review assigned to you\')">Take review</button><button class="btn ghost" onclick="product(\'cvm\');setTimeout(()=>tx(\'CLM-48352\'),30)">View execution</button>':'<button class="btn ghost" onclick="toast(\'Timeline opened\')">View timeline</button>'}</div></div>${foot()}`}
function maria(){$("crumb").textContent="Claims / CLM-48291";$("page").innerHTML=`<div class=eye>CLAIM</div><div class=title><h1>Maria Chen</h1>${badge(S.mariaRecovered?"Complete":"Needs recovery")}</div><div class=sub>CLM-48291 · Auto glass</div><div class=exec><h3 style="margin:0;color:var(--navy)">Claim workflow</h3>${graph(false)}<div class=sub>${S.mariaRecovered?"Claim update completed. Existing payment was preserved.":"Payment succeeded. Claim update failed after the external effect committed."}</div><div class=actions>${S.mariaRecovered?'<button class="btn ghost" onclick="product(\'cvm\');setTimeout(()=>tx(\'CLM-48291\'),30)">View execution</button>':'<button class=btn onclick="product(\'cvm\');setTimeout(()=>tx(\'CLM-48291\'),30)">View execution</button>'}</div></div>${S.mariaRecovered?`<div class=card><h3>Execution history</h3><table><thead><tr><th>Execution</th><th>Action</th><th>Runtime</th><th>Model</th><th>Status</th></tr></thead><tbody><tr onclick="product('cvm');setTimeout(()=>tx('CLM-48291'),30)"><td><b>TX-91821</b></td><td>Settle claim</td><td>AWS · Bedrock</td><td>Claude Sonnet</td><td>${badge("Recovered")}</td></tr>${S.mariaFollowup?`<tr onclick="product('cvm');setTimeout(()=>tx('TX-92107'),30)"><td><b>TX-92107</b></td><td>Close claim</td><td>${S.mariaFollowup.cloud} · ${S.mariaFollowup.provider}</td><td>${S.mariaFollowup.model}</td><td>${badge(S.mariaFollowup.state)}</td></tr>`:""}</tbody></table>${S.moveDone&&!S.mariaFollowup?`<div class=actions><button class=btn onclick="product('cvm');setTimeout(runMariaFollowup,30)">Run follow-up on current deployment</button></div>`:""}</div>`:""}${foot()}`}
function graph(cvm){let last=S.mariaRecovered?"#25845e":"#b43b31";return`<svg viewBox="0 0 900 150"><line x1="80" y1="65" x2="820" y2="65" stroke="#dce3e9" stroke-width="4"/><g><circle cx="90" cy="65" r="20" fill="#25845e"/><text x="90" y="70" text-anchor="middle" fill="white">✓</text><text x="90" y="110" text-anchor="middle" font-size="10" fill="#596778">Policy</text></g><g><circle cx="260" cy="65" r="20" fill="#25845e"/><text x="260" y="70" text-anchor="middle" fill="white">✓</text><text x="260" y="110" text-anchor="middle" font-size="10" fill="#596778">Model</text></g><g class=node onclick="${cvm?"paymentDrawer()":"toast('Payment committed · PAY-88421')"}"><circle cx="440" cy="65" r="22" fill="#25845e"/><text x="440" y="70" text-anchor="middle" fill="white">✓</text><text x="440" y="110" text-anchor="middle" font-size="10" fill="#596778">Payment</text><text x="440" y="124" text-anchor="middle" font-size="8" fill="#25845e">COMMITTED</text></g><g><circle cx="610" cy="65" r="20" fill="#3454d1"/><text x="610" y="70" text-anchor="middle" fill="white">◆</text><text x="610" y="110" text-anchor="middle" font-size="10" fill="#596778">Checkpoint</text></g><g class=node><circle cx="790" cy="65" r="22" fill="${last}"/><text x="790" y="70" text-anchor="middle" fill="white">${S.mariaRecovered?"✓":"!"}</text><text x="790" y="110" text-anchor="middle" font-size="10" fill="#596778">Claim update</text><text x="790" y="124" text-anchor="middle" font-size="8" fill="${last}">${S.mariaRecovered?"COMPLETE":"HTTP 503"}</text></g></svg>`}
function david(){$("crumb").textContent="Approvals / CLM-48307";$("page").innerHTML=S.david?`<div class=eye>SETTLEMENT APPROVAL</div><div class=title><h1>David Park</h1>${badge(S.david=="Denied"?"Denied":"Complete")}</div><div class=hero><h2>${S.david=="Adjusted"?"Approved · $"+S.davidAmount.toLocaleString():S.david}</h2><div class=sub>Decision committed. The workflow resumed from its policy hold.</div></div><div class=actions><button class=btn onclick="go('Claims')">Back to claims</button></div>${foot()}`:`<div class=eye>SETTLEMENT APPROVAL</div><div class=title><h1>David Park</h1>${badge("Approval required")}</div><div class=card><div class=label>AGENT RECOMMENDATION</div><div class=big>$12,400</div><div class=kv><div>Coverage</div><b>Collision · covered</b><div>Autonomous authority</div><b>≤ $10,000</b><div>Reason</div><b>Settlement exceeds authority</b></div><div class=actions><button class=btn onclick="decision('Approved',12400)">Approve</button><button class="btn ghost" onclick=adjustDavid()>Adjust & approve</button><button class="btn danger" onclick="decision('Denied',0)">Deny</button></div></div>${foot()}`}
function adjustDavid(){$("overlay").classList.add("show");$("modal").innerHTML=`<div class=eye>ADJUST SETTLEMENT</div><h2>David Park · CLM-48307</h2><div class=sub>Change the approved amount and record why.</div><div class=card><div class=label>APPROVED AMOUNT</div><input id=davidAmt type=number min=0 step=100 value="${S.davidAmount}" style="width:100%;margin-top:7px;border:1px solid #d7dee5;border-radius:7px;padding:11px;font:700 18px inherit;color:var(--navy)"><div class=label style="margin-top:14px">REASON</div><textarea id=davidReason style="width:100%;height:72px;margin-top:7px;border:1px solid #d7dee5;border-radius:7px;padding:10px;font:11px inherit;resize:none" placeholder="e.g. Adjusted to verified repair estimate"></textarea></div><div class=actions><button class=btn onclick=commitDavidAdjustment()>Adjust & approve</button><button class="btn ghost" onclick=closeModal()>Cancel</button></div>`}
function commitDavidAdjustment(){let amt=Number($("davidAmt").value),reason=$("davidReason").value.trim();if(!Number.isFinite(amt)||amt<=0){toast("Enter a valid approved amount");return}if(!reason){toast("Add a reason for the adjustment");return}S.davidReason=reason;closeModal();decision("Adjusted",amt)}
function decision(d,a){S.david=d;S.davidAmount=a;toast("Decision committed");setTimeout(david,500)}

function deployments(){$("crumb").textContent="CVM / Deployments";$("page").innerHTML=`<div class=eye>CVM CONTROL PLANE</div><div class=title><h1>Claims Agent · Production</h1>${badge("Healthy")}</div><div class=sub>${S.image} · CVM Runtime</div><div class=deployGrid><div class=deploy><div class=label>DEPLOYMENT TOPOLOGY</div><div class=topology><svg viewBox="0 0 620 170"><rect x="20" y="55" width="150" height="65" rx="8" fill="#eef2ff" stroke="#cbd5f4"/><text x="95" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#102746">CVM Runtime</text><text x="95" y="101" text-anchor="middle" font-size="9" fill="#667587">${S.image}</text><line x1="170" y1="87" x2="260" y2="87" stroke="#cfd8e2" stroke-width="3"/><rect x="260" y="25" width="150" height="55" rx="8" fill="#f1faf5" stroke="#cce9db"/><text x="335" y="50" text-anchor="middle" font-size="11" font-weight="700" fill="#102746">${S.cloud}</text><text x="335" y="67" text-anchor="middle" font-size="9" fill="#667587">${S.region} · ${S.instances} instances</text><rect x="260" y="100" width="150" height="55" rx="8" fill="#fff8e8" stroke="#f0dfb5"/><text x="335" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#102746">${S.provider}</text><text x="335" y="142" text-anchor="middle" font-size="9" fill="#667587">${S.model}</text><line x1="410" y1="52" x2="500" y2="52" stroke="#cfd8e2" stroke-width="3"/><line x1="410" y1="127" x2="500" y2="127" stroke="#cfd8e2" stroke-width="3"/><circle cx="525" cy="52" r="18" fill="#25845e"/><circle cx="575" cy="52" r="18" fill="#25845e"/><circle cx="525" cy="127" r="18" fill="#3454d1"/><circle cx="575" cy="127" r="18" fill="#3454d1"/></svg></div><div class=actions><button class=btn onclick=moveDialog()>Move deployment</button>${S.moveDone?'<button class="btn ghost" onclick=runMariaFollowup()>Run Maria follow-up</button>':''}<button class="btn ghost" onclick=rollout()>Deploy new version</button><button class="btn ghost" onclick=rollbackDialog()>Rollback</butto function recover(){$("overlay").classList.add("show");$("modal").innerHTML=`<div class=eye>RECOVER TRANSACTION</div><h2>Resume CLM-48291</h2><div class=sub id=rmsg>Restoring checkpoint after_payment…</div><div class=progressWrap style="margin-top:20px"><div class=progressHead><span>Recovery</span><b id=rcp>0%</b></div><div class=progress><i id=rcbar></i></div></div><div class=timeline id=revents><div class=event>Checkpoint located</div></div>`;let p=0,t=setInterval(()=>{p+=20;$("rcbar").style.width=p+"%";$("rcp").textContent=p+"%";if(p==40){$("rmsg").textContent="Reconciling external effects…";$("revents").innerHTML+='<div class=event>PAY-88421 already committed · skip</div>'}if(p==60){$("rmsg").textContent="Retrying claims.update…";$("revents").innerHTML+='<div class="event am">claims.update retrying</div>'}if(p==80){$("revents").innerHTML+='<div class=event>claims.update · 200 OK</div>'}if(p>=100){clearInterval(t);S.mariaRecovered=true;$("rmsg").textContent="Recovered in 1.3s · no duplicate effects";$("revents").innerHTML+='<div class=event>transaction.complete</div>';$("modal").innerHTML+=`<div class=actions><button class=btn onclick="closeModal();tx('CLM-48291')">View transaction</button><button class="btn ghost" onclick="closeModal();product('north');setTimeout(maria,30)">Return to Northstar</button></div>`}},360)}
function runMariaFollowup(){closeModal();S.mariaFollowup={id:"TX-92107",claim:"CLM-48291",action:"Close claim",model:S.model,provider:S.provider,cloud:S.cloud,region:S.region,state:"Running"};toast(`Starting Maria follow-up on ${S.model}…`);setTimeout(()=>{S.mariaFollowup.state="Complete";S.testRan=true;toast("Maria follow-up complete");product("north");setTimeout(maria,40)},1300)}
function cPolicies(){$("crumb").textContent="CVM / Policies";$("page").innerHTML=`<div class=eye>POLICY BUNDLE</div><h1>claims-v8</h1><div class=card><table><tbody><tr><td>Autonomous settlement</td><td><b>≤ $10,000</b></td><td>${badge("Ready")}</td></tr><tr><td>Above $10,000</td><td><b>Human approval</b></td><td>${badge("Approval required")}</td></tr><tr><td>PII outside approved region</td><td><b>Block</b></td><td>${badge("Denied")}</td></tr></tbody></table></div>${foot()}`}
function models(){$("crumb").textContent="CVM / Models";$("page").innerHTML=`<div class=eye>MODEL INTERFACES</div><h1>Models</h1><div class=artifactGrid>${[["Claude Sonnet","AWS Bedrock","1.8s"],["Gemini 2.5 Pro","Vertex AI","1.5s"],["GPT-5","OpenAI","1.3s"]].map(x=>`<div class=artifact onclick="modelDetail('${x[0]}','${x[1]}','${x[2]}')"><div class=label>${x[1]}</div><h3>${x[0]}</h3><div class=kpis><div><b>${x[2]}</b><span>p95</span></div><div><b>95%</b><span>Claims eval</span></div></div></div>`).join("")}</div>${foot()}`}
function modelDetail(name,provider,p95){$("drawer").innerHTML=`<button class=close onclick=closeDrawer()>×</button><div class=label>${provider}</div><div class=big>${name}</div><div class=card><h3>Production profile</h3><div class=kv><div>p95 latency</div><b>${p95}</b><div>Claims eval</div><b>95%</b><div>Interface</div><b>CVM model contract</b><div>Deployments</div><b>Claims Agent</b></div></div><div class=actions><button class=btn onclick="closeDrawer();go('Deployments')">View deployment</button></div>`;$("drawer").classList.add("show")}
function tools(){$("crumb").textContent="CVM / Tools";$("page").innerHTML=`<div class=eye>TOOL CONTRACTS</div><h1>Tools</h1><div class=artifactGrid>${["Payment Service","Claims API","Policy Service","Document Store","Fraud Service","Customer API"].map((x,i)=>`<div class=artifact onclick="toolDetail('${x}')"><div class=label>TOOL CONTRACT</div><h3>${x}</h3><div class=kpis><div><b>${[247,681,1104,522,189,734][i]}</b><span>Calls today</span></div><div><b>${i==1?4:i==0?2:0}</b><span>Failures</span></div></div></div>`).join("")}</div>${foot()}`}
function toggleTail(){let b=$("tailBtn");if(!b)return;let on=b.textContent.includes("●");b.textContent=on?"Live tail Ⅱ":"Live tail ●";toast(on?"Live tail paused":"Live tail resumed")}
function filterLogs(){let q=($("logSearch")?.value||"").toLowerCase(),c=$("logConsole");if(!c)return;c.style.opacity=q?"1":".92";c.title=q?"Filtering for "+q:"All log events"}
function toolDetail(name){$("drawer").innerHTML=`<button class=close onclick=closeDrawer()>×</button><div class=label>TOOL CONTRACT</div><div class=big>${name}</div>${badge("Healthy")}<div class=card><h3>Production contract</h3><div class=kv><div>Authentication</div><b>Workload identity</b><div>Timeout</div><b>5s</b><div>Retry policy</div><b>Bounded · idempotent only</b><div>Schema</div><b>Validated</b></div></div><div class=card><h3>Recent activity</h3><div class=timeline><div class=event>Call completed · 200</div><div class=event>Contract validation passed</div><div class="event am">p95 within SLO</div></div></div><div class=actions><button class="btn ghost" onclick="closeDrawer();go('Logs')">Open logs</button></div>`;$("drawer").classList.add("show")}

function openCommand(){$("overlay").classList.add("show");$("modal").innerHTML=`<div class=eye>COMMAND</div><h2>Go anywhere</h2><input id=cmdInput autofocus placeholder="Search claims, transactions, images, or actions…" style="width:100%;margin-top:14px;border:1px solid #d7dee5;border-radius:7px;padding:12px;font:12px inherit"><div class=card><table><tbody><tr onclick="closeModal();product('north');setTimeout(()=>claim('CLM-48291'),30)"><td><b>Maria Chen</b></td><td>CLM-48291 · failed claim</td></tr><tr onclick="closeModal();product('north');setTimeout(david,30)"><td><b>David Park</b></td><td>CLM-48307 · approval</td></tr><tr onclick="closeModal();product('cvm');setTimeout(()=>tx('PROC-7712'),30)"><td><b>PROC-7712</b></td><td>Waiting 4d 7h</td></tr><tr onclick="closeModal();product('cvm');setTimeout(()=>go('Builder'),30)"><td><b>Build agent</b></td><td>Intent → agent image</td></tr><tr onclick="closeModal();product('cvm');setTimeout(()=>go('Deployments'),30)"><td><b>Claims Agent</b></td><td>Production deployment</td></tr></tbody></table></div><div class=sub">Tip: press Esc to close.</div>`;setTimeout(()=>{if($("cmdInput"))$("cmdInput").focus()},30)}
document.addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()=="k"){e.preventDefault();openCommand()}if(e.key=="Escape")closeModal()});
try{product("north")}catch(e){$("page").innerHTML=`<h1>Prototype error</h1><pre>${e.stack||e.message}</pre>`}
</script></body></html>
